{n:1,t:'ปกบทเรียน — Types, Sources, and Doses Received / Interaction of X-Radiation With Matter',short:'ปกบทเรียน',div:true,
 body:[{p:'หน้าปกบทที่ 2 ระบุเนื้อหาหลัก 2 ส่วน คือ <b>Types, Sources, and Doses Received</b> (ชนิด แหล่งกำเนิด และปริมาณรังสีที่ได้รับ) และ <b>Interaction of X-Radiation With Matter</b> (อันตรกิริยาของรังสีเอกซ์กับสสาร) บรรยายโดย <b>Pornchai Chamta, M.Sc.</b> (25 November BE 2569)'}],
 key:['เป็นหน้าเปิดบทที่ 2 ไม่มีเนื้อหาบรรยายเพิ่มเติม']},
{n:2,t:'Recap — ภาพรวม 4 แกนหลักของรังสีวิทยา',short:'Recap: ภาพรวมรังสีวิทยา',
 body:[{p:'ทบทวนหัวข้อพื้นฐานที่เชื่อมจากบทก่อนหน้า เพื่อให้เห็นภาพรวมก่อนลงลึกในบทที่ 2:'},
 {ul:['<b>Source of Radiation (แหล่งกำเนิดรังสี)</b>: Natural Background Radiation (รังสีพื้นหลังตามธรรมชาติ), Manmade Radiation (รังสีที่มนุษย์สร้างขึ้น), Medical Radiation (รังสีทางการแพทย์) และ Nuclear Power Plant (โรงไฟฟ้านิวเคลียร์)',
 '<b>Type of Radiation (ชนิดของรังสี)</b> แบ่ง 2 กลุ่มใหญ่ — Electromagnetic Radiation (รังสีแม่เหล็กไฟฟ้า) มีทั้ง Ionizing (ก่อไอออน) และ Non-ionizing (ไม่ก่อไอออน) / Particulate Radiation (รังสีอนุภาค) ได้แก่ Alpha (แอลฟา, α), Beta (บีตา, β), Neutron (นิวตรอน, n) และ Proton (โปรตอน, p⁺)',
 '<b>ปริมาณรังสีทางชีวภาพ</b>: Equivalent Dose (ปริมาณรังสีสมมูล, EqD) คำนึงถึงชนิดของรังสี และ Effective Dose (ปริมาณรังสียังผล) คำนึงถึงความไวต่อรังสีของแต่ละอวัยวะ',
 '<b>Biologic Damage (ความเสียหายทางชีวภาพ)</b>: Deterministic Effect (ผลแบบกำหนดแน่นอน — มีค่าขีดเริ่มเปลี่ยน) และ Stochastic Effect (ผลแบบสุ่ม — ไม่มีค่าขีดเริ่มเปลี่ยน)']},
 {note:'บนสไลด์ต้นฉบับพิมพ์ตัวย่อ Effective Dose ว่า <b>EID</b> ซึ่งโดยมาตรฐานฟิสิกส์รังสีมักใช้ <b>EfD</b> หรือ <b>E</b>'}],
 key:['โครงสร้างภาพรวม 4 แกนหลัก: แหล่งกำเนิด → ชนิดของรังสี → ปริมาณรังสีที่วัดผลทางชีวภาพ → ผลกระทบต่อเนื้อเยื่อสิ่งมีชีวิต','จุดสังเกต: ตัวย่อ Effective Dose บนสไลด์ระบุเป็น (EID)']},
{n:3,t:'แผนภาพสัดส่วนแหล่งกำเนิดรังสีและระดับปริมาณรังสี (UKHSA & Comparative Dose Scale)',short:'แผนภาพปริมาณรังสี (UKHSA)',
 body:[{p:'แสดงข้อมูลเชิงปริมาณของ Radiation Dose (ปริมาณรังสี) ที่มนุษย์ได้รับในชีวิตประจำวัน เปรียบเทียบสัดส่วนแหล่งกำเนิดรังสีเฉลี่ยของสหราชอาณาจักร (UK) คู่กับมาตราส่วนเปรียบเทียบปริมาณรังสีในหน่วยมิลลิซีเวิร์ต (mSv) เพื่อประเมินระดับความเสี่ยงจากการตรวจทางรังสีวินิจฉัยเทียบกับรังสีพื้นหลังตามธรรมชาติ'},
 {viz:'ukdonut'},
 {p:'<b>แผนภูมิวงกลมซ้าย</b> (UK Health Security Agency, Crown copyright 2022): ค่าเฉลี่ยประชากร UK ได้รับ <span class="fx">2.7 mSv/ปี</span> — ก๊าซเรดอนจากพื้นดิน <b>48%</b> (มากที่สุด), รังสีทางการแพทย์ <b>16%</b>, Terrestrial gamma (แกมมาจากพื้นดิน) <b>13%</b>, Cosmic (คอสมิกจากอวกาศ) <b>12%</b>, การรับสารกัมมันตรังสีเข้าร่างกายไม่รวมเรดอน (อาหาร/น้ำ) <b>11%</b> · แหล่งจากมนุษย์ส่วนน้อย: Nuclear weapons fallout <b>0.2%</b>, Occupational exposure <b>0.02%</b>, Radioactive discharges <b>0.01%</b>'},
 {viz:'dosebars'},
 {p:'<b>แท่งมาตราส่วนแนวตั้งขวา</b> (Amount of radiation หน่วย mSv แบบลอการิทึม 0.01–10 mSv) — ในเว็บนี้แปลงเป็นกราฟแท่งแนวนอนแบบโต้ตอบได้ด้านบน โดยฝั่งธรรมชาติ/การเดินทาง/เกณฑ์มาตรฐาน gồm: Guarapari (บราซิล) <span class="fx">10 mSv/ปี</span>, ค่าเฉลี่ยโลก <span class="fx">2.4 mSv/ปี</span> (เรดอนในอากาศ 1.26 + พื้นดิน 0.48 + อวกาศ 0.39 + อาหาร 0.29), ญี่ปุ่น <span class="fx">2.1 mSv/ปี</span>, เที่ยวบินไป-กลับโตเกียว–นิวยอร์ก <span class="fx">0.11–0.16 mSv</span>, โรงงานแปรสภาพเชื้อเพลิงนิวเคลียร์ Rokkasho <span class="fx">0.022 mSv/ปี</span>, Clearance level <span class="fx">0.01 mSv/ปี</span> (ต่ำมากจนไม่ต้องจัดการเป็นวัสดุกัมมันตรังสีเชิงความปลอดภัย)'},
 {p:'ฝั่งรังสีทางการแพทย์และเกณฑ์จำกัด: Total body CT scan 1 ครั้ง <span class="fx">2.4–12.9 mSv</span>, เอกซเรย์กระเพาะอาหาร (Full stomach X-ray mass examination) <span class="fx">3.0 mSv</span>, ขีดจำกัดประชาชนทั่วไปต่อปี (ไม่รวมการรักษาทางการแพทย์) <span class="fx">1.0 mSv</span>, Chest X-ray 1 ครั้ง <span class="fx">0.06 mSv</span>, Dose objective รอบโรงไฟฟ้านิวเคลียร์ <span class="fx">0.05 mSv/ปี</span>'}],
 key:['ก๊าซ Radon (เรดอน) จากพื้นดินเป็นแหล่งรังสีธรรมชาติใหญ่ที่สุด (48% ใน UK และ 1.26 จาก 2.4 mSv ในค่าเฉลี่ยโลก)','ค่าเฉลี่ยรังสีธรรมชาติทั่วโลก 2.4 mSv/ปี ขณะที่ขีดจำกัดประชาชนทั่วไป (ไม่รวมทางการแพทย์) คือ 1.0 mSv/ปี','CT ทั้งตัว (2.4–12.9 mSv) ให้ปริมาณรังสีสูงกว่า Chest X-ray (0.06 mSv) หลายสิบถึงหลายร้อยเท่า']},
{n:4,t:'สัดส่วนแหล่งกำเนิดรังสีธรรมชาติเทียบกับรังสีที่มนุษย์สร้างขึ้น (84% Natural vs 16% Artificial)',short:'ธรรมชาติ 84% vs มนุษย์ 16%',
 body:[{p:'จัดกลุ่มข้อมูลจากสไลด์ 3 ให้เห็นความต่างชัดเจนระหว่าง <b>Natural Radiation (ธรรมชาติ)</b> กับ <b>Artificial Radiation (มนุษย์สร้างขึ้น)</b> — แม้ประชาชนมักกังวลเรื่องโรงไฟฟ้านิวเคลียร์หรืออาชีพทางรังสี แต่รังสีส่วนใหญ่ที่มนุษย์ได้รับมาจากธรรมชาติ และแหล่งจากมนุษย์ที่สำคัญที่สุดคือรังสีทางการแพทย์'},
 {viz:'natdonut'},
 {p:'กลุ่ม <b>Natural รวม 84%</b> (โทนน้ำเงิน): เรดอนจากพื้นดิน 48% · แกมมาจากพื้นดินและอาคาร 13% · รังสีคอสมิก 12% · การรับสารกัมมันตรังสีไม่รวมเรดอน 11% — กลุ่ม <b>Artificial รวม 16%</b> (โทนแดง/ชมพู): Medical 16% ครองเกือบทั้งหมด ที่เหลือน้อยมาก: Occupational 0.2%, Fallout 0.2%, Nuclear discharges &lt;0.1%, Products ≪0.1%'}],
 key:['ประมาณ 84% ของรังสีที่ได้รับมาจากธรรมชาติ และ 16% จากมนุษย์สร้างขึ้น','รังสีทางการแพทย์เป็นแหล่งรังสีที่มนุษย์สร้างขึ้นใหญ่ที่สุด จึงต้องให้ความสำคัญกับการป้องกันอันตรายและการใช้รังสีอย่างคุ้มค่าทางคลินิก']},
{n:5,t:'Recap — ประเภทของรังสี (Electromagnetic Spectrum: Ionizing vs Non-ionizing)',short:'Ionizing vs Non-ionizing',
 body:[{p:'จำแนกรังสีตามความสามารถทำให้สสารแตกตัวเป็นไอออน: <b>Ionizing Radiation (รังสีก่อไอออน)</b> พลังงานสูงพอดึงอิเล็กตรอนหลุดจากอะตอม ประกอบด้วย Electromagnetic (X-ray, Gamma) และ Particulate (Alpha, Beta, Neutron, Proton) เทียบกับ <b>Non-ionizing Radiation (รังสีไม่ก่อไอออน)</b> พลังงานต่ำกว่า ทำให้อะตอมแตกตัวเป็นไอออนไม่ได้'},
 {viz:'spectrum'},
 {p:'<b>ภาพบน — Electromagnetic Spectrum</b>: แถบคลื่นต่อเนื่องจากซ้ายไปขวา: Gamma rays (รังสีแกมมา) → X-rays (รังสีเอกซ์) → Ultraviolet (อัลตราไวโอเลต) → Visible light (แสงที่ตามองเห็น) → Infrared (อินฟราเรด) → Microwave (ไมโครเวฟ) → Radio (คลื่นวิทยุ) · ด้านซ้าย (Gamma, X-rays): คลื่นถี่มาก Higher energy (พลังงานสูงกว่า), Higher frequency (ความถี่สูงกว่า), Shorter wavelength (ความยาวคลื่นสั้นกว่า) · ด้านขวา (Microwave, Radio): Lower energy, Lower frequency, Longer wavelength'},
 {p:'<b>ภาพล่าง — แถบเปรียบเทียบ</b>: ฝั่ง Non-ionizing ได้แก่ Visible light (การมองเห็นดอกไม้), Radio waves (เสาสัญญาณวิทยุและเครื่องรับ), Microwaves (เตาไมโครเวฟอุ่นอาหาร) · ฝั่ง Ionizing ได้แก่ การฉายรังสีรักษามะเร็งด้วยแกมมา, X-rays (ถ่ายภาพรังสีกระดูกมือ), วัสดุกัมมันตรังสีในโรงไฟฟ้านิวเคลียร์ เช่น ²³⁸₉₂U (ยูเรเนียม)'}],
 key:['พลังงานของคลื่นแม่เหล็กไฟฟ้าแปรผันตรงกับความถี่ แต่แปรผกผันกับความยาวคลื่น','X-rays และ Gamma rays อยู่ฝั่งพลังงานสูงที่สุดของสเปกตรัม และจัดเป็น Ionizing Radiation']},
{n:6,t:'X-Ray vs Gamma ray — ต่างกันที่ “แหล่งกำเนิด” เท่านั้น',short:'X-ray vs Gamma ray',
 body:[{p:'จุดแตกต่างเพียงประการเดียวที่เป็นหัวใจสำคัญระหว่าง <b>X-ray (รังสีเอกซ์)</b> และ <b>Gamma ray (รังสีแกมมา)</b>: ทั้งคู่เป็นคลื่นแม่เหล็กไฟฟ้าก่อไอออนที่มีคุณสมบัติทางกายภาพเหมือนกันเมื่ออยู่ช่วงพลังงานเดียวกัน แต่ต่างกันที่ <b>แหล่งกำเนิด (Origin)</b> ภายในอะตอม'},
 {viz:'origin'},
 {fig:'FIGURE 3-8 (ซ้าย): แบบจำลองอะตอม ลูกศรคลื่น X-rays พุ่งออกจากบริเวณวงโคจรอิเล็กตรอนด้านนอกนิวเคลียส — “X-rays are produced outside the nucleus of excited atoms.” (รังสีเอกซ์ถูกผลิตนอกนิวเคลียสของอะตอมที่ถูกกระตุ้น) · FIGURE 3-9 (ขวา): ลูกศรคลื่น Gamma rays พุ่งออกจากใจกลางนิวเคลียสโดยตรง — “Gamma rays are produced inside the nucleus of radioactive atoms.” (รังสีแกมมาถูกผลิตภายในนิวเคลียสของอะตอมกัมมันตรังสี)'}],
 key:['X-rays เกิดขึ้น<b>นอกนิวเคลียส</b> (Outside the nucleus) จากการเปลี่ยนแปลงของอิเล็กตรอนในอะตอมที่ถูกกระตุ้น','Gamma rays เกิดขึ้น<b>ภายในนิวเคลียส</b> (Inside the nucleus) ของอะตอมกัมมันตรังสีที่ไม่เสถียร']},
{n:7,t:'Recap — คุณสมบัติของคลื่นแม่เหล็กไฟฟ้าและสมการพลังงาน',short:'สมการคลื่นและพลังงาน',
 body:[{p:'คุณสมบัติทางกายภาพ 4 ประการของ <b>Electromagnetic Wave (คลื่นแม่เหล็กไฟฟ้า)</b>: ความถี่ (Frequency), ความยาวคลื่น (Wavelength), ความเร็ว (Velocity) และแอมพลิจูด (Amplitude) — ในงานรังสีเทคนิค พลังงานแม่เหล็กไฟฟ้าเป็นหัวใจของการสร้างภาพวินิจฉัย โดยเฉพาะ X-rays และ Gamma rays ซึ่งเป็น Ionizing Radiation ที่ต้องระมัดระวังเป็นพิเศษเพราะก่ออันตรายต่อเนื้อเยื่อได้'},
 {fx:'<b>The Wave Equation (สมการคลื่น):</b>  c = fλ'},
 {fx:'<b>Electromagnetic Energy (พลังงานโฟตอน):</b>  E = hf = hc/λ'},
 {ul:['<span class="fx">E</span> = พลังงานของโฟตอน หน่วยจูล (J)','<span class="fx">h</span> = Planck’s constant (ค่าคงที่ของพลังค์) = <span class="fx">6.63×10⁻³⁴ J·s</span>','<span class="fx">c</span> = ความเร็วแสงในสุญญากาศ = <span class="fx">2.998×10⁸ m/s</span>','<span class="fx">f</span> = ความถี่ หน่วยเฮิรตซ์ (Hz) · <span class="fx">λ</span> = ความยาวคลื่น หน่วยเมตร (m)']},
 {note:'บนสไลด์ต้นฉบับ สัญลักษณ์ λ หน้าคำว่า “: ความยาวคลื่น (m)” แสดงผลไม่ติด/หายไป แต่สอดคล้องกับตัวแปร λ ในสมการด้านบน'}],
 key:['c และ h เป็นค่าคงที่ → ความยาวคลื่น (λ) สั้นลง เมื่อใด ความถี่ (f) และพลังงานโฟตอน (E) สูงขึ้น (จาก c = fλ จะได้ E = hf)','ต้องจำ h = 6.63×10⁻³⁴ J·s และ c = 2.998×10⁸ m/s เพื่อใช้คำนวณพื้นฐาน']},
{n:8,t:'Recap — Amplitude of a wave & Wavelength',short:'แอมพลิจูดและความยาวคลื่น',
 body:[{p:'ขยายความหมายคุณสมบัติคลื่น 2 ประการจากสไลด์ 7 เพื่อให้เข้าใจโครงสร้างคลื่นรูปไซน์ (Sine wave) อย่างชัดเจน — ทดลองปรับค่าได้เองในแลปด้านล่าง'},
 {fig:'FIGURE 3-1 (ซ้าย — Amplitude): คลื่นไซน์ 3 เส้น A, B, C ความยาวคลื่นและความถี่เท่ากันทุกประการ แต่ต่างที่ Amplitude — ระยะตั้งฉากจากเส้นกึ่งกลาง (Baseline) ถึงยอดคลื่น (Crest) หรือท้องคลื่น (Valley) โดย A สูงสุด รองลงมา B และ C ต่ำสุด · FIGURE 3-4 (ขวา — Wavelength): คลื่น 3 เส้นความยาวคลื่นต่างกัน — A: λ = 1 cm (ยาวสุด ถี่ต่ำสุด), B: λ = 0.5 cm, C: λ = 1.5 mm (สั้นสุด ถี่สูงสุด) พร้อมคำบรรยาย “The shorter the wavelength (λ), the higher is the frequency.”'}],
 key:['Amplitude คือความสูงจากแนวกลางถึงยอดคลื่น (Crest) หรือท้องคลื่น (Valley) <b>ไม่ได้กำหนดพลังงานต่อโฟตอน</b>ของรังสีแม่เหล็กไฟฟ้า (แต่สัมพันธ์กับความเข้มของคลื่น)','Wavelength (λ) แปรผกผันกับ Frequency (f) โดยตรง']},
{n:9,t:'Atom & Energy (Radiation: Types, Sources, and Doses Received)',short:'คั่น: Atom & Energy',div:true,
 body:[{p:'หน้าคั่นหัวข้อ (Section Divider) เข้าสู่หัวข้อหลัก <b>Atom & Energy</b> ภายใต้ส่วน Radiation: Types, Sources, and Doses Received'}],
 key:['เป็นหน้าคั่นเปลี่ยนหัวข้อเข้าสู่เรื่องอะตอมและพลังงาน ไม่มีเนื้อหาบรรยายเพิ่มเติม']},
{n:10,t:'Atom & Energy — Atom (ยุคนักปราชญ์ชาวกรีก)',short:'อะตอมยุคกรีก',
 body:[{p:'<b>Democritus (เดโมคริตุส)</b> เสนอว่า หากแบ่งสสารเล็กลงไปเรื่อย ๆ จะต้องถึงชิ้นส่วนเล็กที่สุดซึ่งแบ่งต่อไม่ได้อีก เรียกหน่วยนี้ว่า <b>atomos</b> (แบ่งไม่ได้) นอกจากนี้ นักปราชญ์บางคนในยุคนั้นเชื่อว่าสารทุกชนิดประกอบด้วยอะตอมชนิดเดียวกัน แต่คุณสมบัติทางกายภาพที่ต่างกัน เช่น แข็ง นิ่ม หนาแน่นมาก/น้อย เกิดจาก<b>รูปแบบการจัดเรียงตัวของอะตอม</b>ที่ต่างกัน'},
 {fig:'ภาพวาดบุคคลเหมือนของ Democritus นักปราชญ์ชาวกรีก ในท่ากำลังยิ้มและผายมือ ประกอบการเล่าประวัติแนวคิดอะตอมยุคแรก'}],
 key:['คำว่า “Atom” มีรากศัพท์ภาษากรีกว่า atomos (แบ่งไม่ได้) เสนอโดย Democritus']},
{n:11,t:'Atom & Energy — Atom (ยุคดอลตัน)',short:'ทฤษฎีอะตอมของดอลตัน',
 body:[{p:'จากแนวคิดเชิงปรัชญาของกรีกเข้าสู่ยุควิทยาศาสตร์สมัยใหม่โดย <b>John Dalton (จอห์น ดอลตัน)</b> ผู้นำเสนอ <b>Dalton’s Atomic Theory (ทฤษฎีอะตอมของดอลตัน)</b> หลักการสำคัญ 4 ประการ:'},
 {ol:['สสารทุกชนิดประกอบด้วยอะตอม','อะตอมของธาตุชนิดเดียวกันมีสมบัติเหมือนกันทั้งหมด','ธาตุที่ต่างชนิดกันมีอะตอมที่แตกต่างกัน','การเกิดปฏิกิริยาเคมีคือการจัดเรียงตัวใหม่ของอะตอม (ไม่ได้สร้างหรือทำลายอะตอม)']},
 {fig:'ภาพเหมือนลายเส้นของ John Dalton, F.R.S. นั่งที่โต๊ะทำงานพร้อมอุปกรณ์ทดลองและกระดาษแผนภาพสัญลักษณ์วงกลมแทนอะตอมของธาตุต่าง ๆ'}],
 key:['John Dalton วางรากฐานทฤษฎีอะตอมเชิงวิทยาศาสตร์สมัยใหม่ อธิบายความแตกต่างของธาตุและกลไกปฏิกิริยาเคมีผ่านการจัดเรียงอะตอมใหม่']},
{n:12,t:'Atom & Energy — อนุภาคมูลฐานและวิวัฒนาการแบบจำลองอะตอม',short:'อนุภาคมูลฐาน + Timeline',
 body:[{p:'ฟิสิกส์ยุคต่อมาพิสูจน์ว่าอะตอมไม่ใช่ของแข็งตันที่แบ่งไม่ได้แบบความเชื่อกรีก แต่ประกอบด้วย <b>Subatomic Particles (อนุภาคมูลฐาน)</b> 3 ชนิด: Proton (โปรตอน), Neutron (นิวตรอน), Electron (อิเล็กตรอน)'},
 {fx:'Mass number = Number of protons + Number of neutrons = Atomic number + Number of neutrons'},
 {viz:'timeline'},
 {tbl:{cap:'Table 2.1 Mass and Charge of Subatomic Particles (มวลและประจุของอนุภาคมูลฐาน)',head:['Particle (อนุภาค)','Mass (g)','Charge (Coulomb)','Charge Unit (หน่วยประจุ)'],rows:[['Electron','9.10938×10⁻²⁸','−1.6022×10⁻¹⁹','−1'],['Proton','1.67262×10⁻²⁴','+1.6022×10⁻¹⁹','+1'],['Neutron','1.67493×10⁻²⁴','0','0']]}}],
 key:['โปรตอนและนิวตรอนมวลใกล้เคียงกันมาก (นิวตรอนหนักกว่าเล็กน้อย) และหนักกว่าอิเล็กตรอนเกือบ 2,000 เท่า → มวลเกือบทั้งหมดของอะตอมรวมศูนย์ที่นิวเคลียส','โปรตอนประจุ +1, อิเล็กตรอน −1 (ขนาดเท่ากัน 1.6022×10⁻¹⁹ C), นิวตรอนเป็นกลางทางไฟฟ้า (0)']},
{n:13,t:'Atom & Energy — Atomic Mass (สัญลักษณ์นิวเคลียร์และคำศัพท์นิวเคลียส)',short:'สัญลักษณ์นิวเคลียร์ A·Z·X',
 body:[{p:'อะตอมประกอบด้วย <b>Nucleus (นิวเคลียส)</b> ตรงกลาง และ <b>Electrons (อิเล็กตรอน)</b> โคจรโดยรอบ มีคำศัพท์เฉพาะที่ต้องแยกแยะให้แม่นยำ 2 คำ:'},
 {ul:['<b>Nuclide (นิวไคลด์)</b>: ชนิดและองค์ประกอบจำเพาะของนิวเคลียส ระบุด้วยจำนวนโปรตอน (Z) และนิวตรอน (N) ที่แน่นอน','<b>Nucleons (นิวคลีออน)</b>: อนุภาคทั้งหมดภายในนิวเคลียส = โปรตอน + นิวตรอน']},
 {viz:'notation'}],
 key:['A = Atomic Mass Number (เลขมวล) = โปรตอน + นิวตรอน (จำนวนนิวคลีออน)','Z = Atomic Number (เลขอะตอม) = จำนวนโปรตอนทั้งหมด เป็นตัวกำหนดชนิดของธาตุ']},
{n:14,t:'นักศึกษารู้จักคำว่า… The four “isos”',short:'นำเข้าสู่ Four “isos”',div:true,
 body:[{p:'หน้าคั่นคำถามนำเข้าบทเรียน (Transition / Prompt Slide) กระตุ้นให้ทบทวนคำศัพท์นิวเคลียร์ที่ขึ้นต้นด้วย “Iso-” ทั้ง 4 ชนิด ก่อนเฉลยรายละเอียดในสไลด์ 15'}],
 key:['เป็นหน้าคั่นนำเข้าสู่หัวข้อ The four “isos” ไม่มีคำอธิบายเพิ่มเติม']},
{n:15,t:'Atom & Energy — The four “isos” (ออกสอบบ่อย!)',short:'The four “isos”',
 body:[{p:'ความแตกต่างของนิวไคลด์ 4 กลุ่ม — เนื้อหาออกสอบบ่อยในวิชาฟิสิกส์รังสีและเวชศาสตร์นิวเคลียร์:'},
 {viz:'isos'},
 {p:'<b>Isotope (ไอโซโทป)</b>: จำนวนโปรตอน (Z) เท่ากัน → ธาตุเดียวกัน สมบัติเคมีเหมือนกัน แต่จำนวนนิวตรอน (N) ต่างกัน → สมบัติทางนิวเคลียร์และ Half-life (ครึ่งชีวิต) ต่างกัน · ตัวอย่างบนสไลด์: ไอโอดีน-125 และไอโอดีน-131 ทั้งคู่มีสมบัติเคมีเหมือนไอโอดีนเพราะโปรตอนเท่ากัน แต่ครึ่งชีวิตต่างกัน'},
 {note:'ข้อความสไลด์พิมพ์ “125 และ 131” แต่ตารางธาตุด้านข้างแสดง ¹²³₅₃I และ ¹³¹₅₃I (ทั้งคู่โปรตอน 53 เท่ากัน) — ภาพกล่องธาตุคู่บน: ¹²³₅₃I มวลอะตอม 122.9056, การจัดเรียงอิเล็กตรอน 2, 8, 18, 18, 7 เทียบ ¹³¹₅₃I มวล 130.9061, การจัดเรียงอิเล็กตรอนเท่ากัน 2, 8, 18, 18, 7 (เคมีเหมือนกัน) · คู่ล่าง (Isobar): ¹³¹₅₃I (Iodine, Z=53, ชั้นนอก 7) เทียบ ¹³¹₅₄Xe (Xenon, Z=54, ชั้นนอก 8, มวล 130.9051) เลขมวล 131 เท่ากันแต่คนละธาตุ (อ้างอิง periodictable.chemicalaid.com)'},
 {p:'<b>Isotone (ไอโซโทน)</b>: นิวตรอน (N) เท่ากัน แต่โปรตอน (Z) ต่างกัน (คนละธาตุ) · <b>Isobar (ไอโซบาร์)</b>: จำนวนนิวคลีออน (เลขมวล A = p+n) เท่ากัน แต่ Z และ N ต่างกัน เช่น ¹³¹₅₃I สลายตัวให้บีตากลายเป็น ¹³¹₅₄Xe (A=131 เท่าเดิม Z เปลี่ยน 53→54) · <b>Isomer (ไอโซเมอร์)</b>: นิวไคลด์เดียวกัน (Z, N เท่ากันทุกประการ) แต่ระดับพลังงานภายในนิวเคลียสต่างกัน เช่น ⁹⁹ᵐTc → ⁹⁹Tc ตัวอักษร m = Metastable state (กึ่งเสถียร) ปลดปล่อยพลังงานส่วนเกินเป็นแกมมาโดยโปรตอน/นิวตรอนไม่เปลี่ยน'}],
 key:['เทคนิคจำ: Iso<b>p</b>e = <b>P</b>roton เท่า · Iso<b>n</b>e = <b>N</b>eutron เท่า · Isob<b>a</b>r = <b>A</b> (Mass number) เท่า · Isom<b>e</b>r = <b>E</b>nergy ต่าง (นิวไคลด์เดียวกัน)']},
{n:16,t:'Atom & Energy — Nuclear Atom (ความเสถียรของนิวเคลียสและอัตราส่วน n/p)',short:'ความเสถียร n/p + กราฟ',
 body:[{p:'<b>Nuclear Stability (ความเสถียรของนิวเคลียส)</b> ขึ้นกับ <b>Neutron-to-Proton Ratio (n/p ratio)</b> เป็นสำคัญ หากไม่สมดุล นิวเคลียสจะสลายตัวเพื่อปรับตัวเองเข้าใกล้แนวเสถียรภาพ (Line of stability):'},
 {ul:['n/p ใกล้เคียง 1 (ธาตุเบา Z ≤ 20) → เสถียรสูง','n/p <b>สูงเกินไป</b> (นิวตรอนมากเกิน) → สลายตัวแบบ <b>Beta minus decay (β⁻)</b> เปลี่ยนนิวตรอนเป็นโปรตอน → n/p ลดลง','n/p <b>ต่ำเกินไป</b> (โปรตอนมากเกิน) → สลายตัวแบบ <b>Positron decay (β⁺)</b> หรือ <b>Electron Capture (EC)</b> เปลี่ยนโปรตอนเป็นนิวตรอน → n/p สูงขึ้น','นิวเคลียสใหญ่มาก (Z &gt; 82) → มักสลายแบบ <b>Alpha decay (α)</b> ลดทั้งขนาดและจำนวนโปรตอน/นิวตรอนพร้อมกัน']},
 {fig:'กราฟ Fig. 1.1 — แกน Y: จำนวน Neutrons (N), แกน X: จำนวน Protons (Z) · เส้นน้ำเงิน n/p = 1 เป็นเส้นตรงอ้างอิง · เส้นโค้งแดง Stable nuclei: ช่วง Z ≤ 20 ทับเส้น n/p = 1 แต่เมื่อ Z &gt; 20 โค้งเบนขึ้น (นิวเคลียสใหญ่ขึ้นต้องใช้นิวตรอนมากขึ้นเพื่อต้านแรงผลักไฟฟ้าสถิตระหว่างโปรตอน) · เหนือเส้นแดง (นิวตรอนเกิน): β⁻ ลูกศรชี้ลง-ขวา (ลด N เพิ่ม Z) · ใต้เส้นแดง (โปรตอนเกิน): β⁺/EC ลูกศรชี้ขึ้น-ซ้าย · มุมขวาบน Z สูงมาก (&gt;82): α ลูกศรชี้ลง-ซ้าย (ลด N และ Z อย่างละ 2) — ทั้งหมดเข้าหาเส้นเสถียร (สร้างเป็นกราฟโต้ตอบในแลปด้านล่าง)'}],
 key:['นิวเคลียสเสถียรที่ Z ≤ 20 มี n/p ≈ 1 แต่เมื่อ Z &gt; 20 ต้องใช้ n/p &gt; 1 เพื่อให้แรงนิวเคลียร์อย่างเข้มเอาชนะแรงผลักระหว่างโปรตอน','ตำแหน่งของนิวไคลด์เทียบเส้นเสถียรภาพ ทำนายชนิดการสลายตัวกัมมันตรังสีได้ทันที']},
{n:17,t:'Atom & Energy — ความเสถียรกับเลขคู่–เลขคี่ของนิวคลีออน',short:'เลขคู่–คี่ (Even–Odd)',
 body:[{p:'เกณฑ์ความเสถียรอีกประการ: <b>ความเป็นเลขคู่/เลขคี่ของจำนวนโปรตอนและนิวตรอน</b> — นิวเคลียสเสถียรส่วนใหญ่ในธรรมชาติมีทั้งโปรตอนและนิวตรอนเป็นเลขคู่ เพราะนิวคลีออนจับคู่สปินกันได้อย่างสมดุล มีเพียงไม่กี่นิวไคลด์ที่คี่ทั้งคู่แต่ยังเสถียร: ²H (H-2), ⁶Li (Li-6), ¹⁰B (B-10), ¹⁴N (N-14)'},
 {viz:'evenodd'},
 {fig:'กราฟ Fig. 1.1 เดียวกับสไลด์ 16 (แกน N ต่อ Z, เส้น n/p=1, เส้น Stable nuclei, จุดแบ่ง Z=20 และทิศทางการสลายตัว α, β⁻, β⁺) ไม่มีกล่องข้อความสีทับแบบหน้าก่อน'}],
 key:['Even–Even เสถียรที่สุด · Odd–Odd เกือบทั้งหมดไม่เสถียร','ข้อสอบมักถามข้อยกเว้น Odd-Odd ที่เสถียร 4 ตัว: ²H, ⁶Li, ¹⁰B, ¹⁴N']},
{n:18,t:'Atom & Energy — On Mass (สมมูลมวล–พลังงาน, หน่วยมวล และ Mass Defect)',short:'มวล–พลังงาน & Mass Defect',
 body:[{p:'เชื่อมโยงมวลของอนุภาคในนิวเคลียสกับพลังงานยึดเหนี่ยว ตาม <b>Einstein’s Mass-Energy Equivalence (ทฤษฎีสัมพัทธภาพ)</b>: มวลและพลังงานเปลี่ยนรูปไปมาระหว่างกันได้เสมอ'},
 {fx:'E = mc²  และ  m = E/c²'},
 {p:'วิธีวัดมวลในฟิสิกส์นิวเคลียร์ที่ใช้บ่อย 2 ระบบ:'},
 {ul:['<b>Atomic Mass Units (AMU หรือ u — หน่วยมวลอะตอม)</b>: มวลโปรตอน mₚ = <span class="fx">1.0073 AMU</span> · มวลนิวตรอน mₙ = <span class="fx">1.0087 AMU</span> (หนักกว่าโปรตอนเล็กน้อย) · มวลอิเล็กตรอน mₑ = <span class="fx">0.0005 AMU</span> (≈1/2000 ของโปรตอน)','<b>Energy Equivalent (MeV/c² — พลังงานสมมูลของมวล)</b>: ค่าแปลงมาตรฐานที่ต้องจำ <span class="fx">1 AMU = 931.5 MeV</span>']},
 {p:'<b>Mass Defect (ส่วนพร่องมวล, Δm)</b>: เมื่อโปรตอนและนิวตรอนรวมตัวเป็นนิวเคลียส มวลรวมของนิวเคลียสที่ชั่งได้จริงจะ<b>น้อยกว่า</b>ผลรวมมวลโปรตอน+นิวตรอนที่แยกกันอยู่ มวลที่หายไปไม่ได้สูญสลาย แต่เปลี่ยนเป็น <b>Binding Energy (พลังงานยึดเหนี่ยว)</b> ยึดนิวคลีออนไว้ด้วยกัน'},
 {fx:'Δm = (Z·m<sub>p</sub> + N·m<sub>n</sub>) − m<sub>nucleus</sub>'},
 {note:'บนสไลด์ต้นฉบับหัวข้อย่อยพิมพ์ “Mass Defect (Am)” ซึ่งหมายถึง Δm ตามสมการ'}],
 key:['นิวเคลียสที่มี Binding Energy สูง ยิ่งเสถียรสูง (แยกนิวคลีออนออกยาก)','ตัวเลขสำคัญสำหรับคำนวณ: 1 AMU = 931.5 MeV']},
{n:19,t:'Atom & Energy — ตัวอย่างคำนวณ Mass Defect ของ Helium-4',short:'คำนวณ He-4 (BE ≈ 27.27 MeV)',
 body:[{p:'ตัวอย่างคำนวณ <b>Mass Defect (Δm)</b> และ <b>Binding Energy (BE)</b> ของนิวเคลียสฮีเลียม-4 (⁴He: โปรตอน 2 + นิวตรอน 2) ทีละขั้นตอน:'},
 {steps:[{t:'หามวลรวมของอนุภาคองค์ประกอบแยกกัน',b:'m<sub>p+n</sub> = (2×1.007276) + (2×1.008665) = <b>4.031882 amu</b>'},{t:'หาส่วนพร่องมวล Δm = มวลองค์ประกอบ − มวลจริงของนิวเคลียส ⁴He (4.002602 amu)',b:'Δm = 4.031882 − 4.002602 = <b>0.02928 amu</b>'},{t:'แปลงเป็นพลังงานยึดเหนี่ยว คูณ 931.5 MeV/amu',b:'BE = Δm × 931.5 = 0.02928 × 931.5 ≈ <b>27.27 MeV</b>'}]},
 {fig:'กล่องข้อมูลธาตุ Helium (He) จากตารางธาตุ/Wikipedia: เลขอะตอม 2, หมู่ Noble gases, สถานะที่ 0°C เป็น Gas, น้ำหนักอะตอม 4.002602 u ซึ่งถูกใช้เป็น m_nucleus ในสมการ'},
 {note:'ข้อสังเกตเชิงวิชาการ: 4.002602 u เป็น<b>มวลอะตอม</b>ของ ⁴He ที่รวมอิเล็กตรอน 2 ตัวไว้แล้ว แต่สไลด์นำมาใช้แทนค่าโดยตรงเพื่อความสะดวกในการสาธิต'}],
 key:['ขั้นตอนหา Binding Energy 3 ขั้น: มวลองค์ประกอบรวม → ลบมวลจริงได้ Δm → คูณ 931.5 MeV','BE ของ ⁴He สูงมาก (≈27.27 MeV) จึงเป็นเหตุผลที่อนุภาคแอลฟา (⁴₂He) เสถียรและหลุดออกมาเป็นก้อนได้ในการสลายตัว']},
{n:20,t:'Types of Particulate Radiation (Radiation: Types, Sources, and Doses Received)',short:'คั่น: รังสีอนุภาค',div:true,
 body:[{p:'หน้าคั่นหัวข้อเข้าสู่ <b>Types of Particulate Radiation</b> (ชนิดของรังสีอนุภาคและกลไกการสลายตัวกัมมันตรังสี)'}],
 key:['เป็นหน้าคั่นเปลี่ยนหัวข้อ ไม่มีเนื้อหาบรรยายเพิ่มเติม']},
{n:21,t:'Mechanism of radioactive decay — Alpha Particle (α)',short:'Alpha (α)',
 body:[{p:'<b>Alpha Decay</b> เกิดเมื่อนิวเคลียสใหญ่เกินไปหรือมีโปรตอนมากเกิน จึง “ลดน้ำหนัก” ด้วยการปล่อย <b>Alpha particle (α)</b> ซึ่งก็คือ<b>นิวเคลียสของฮีเลียม</b> ⁴₂He (2 โปรตอน + 2 นิวตรอน)'},
 {ul:['เกิดเฉพาะใน Radionuclides (นิวไคลด์กัมมันตรังสี) ขนาดใหญ่ เลขอะตอมสูงกว่า 82 (<span class="fx">Z &gt; 82</span>) เช่น Uranium (U), Thorium (Th), Radium (Ra)','พลังงานอนุภาคแอลฟาทั่วไปอยู่ช่วง <span class="fx">2–8 MeV</span>','มีพลังงานแบบ <b>Monoenergetic (พลังงานเดี่ยวคงที่)</b> — แอลฟาทุกตัวจากนิวไคลด์ชนิดเดียวกันมีพลังงานเฉพาะตัวแน่นอน ไม่กระจายเป็นช่วงต่อเนื่อง']},
 {fx:'²²⁶Ra  →(T½ = 1622 ปี)→  ²²²Rn + ⁴₂He + 4.87 MeV'},
 {note:'บนสไลด์ไม่ได้พิมพ์เลขอะตอม 88 ของ Ra, 86 ของ Rn และเลขมวล 4 ของ He แต่โครงสร้างสมการสลายตัวแอลฟาแสดงผลชัดเจน'},
 {fig:'แผนภาพ Alpha Radiation: นิวเคลียสตั้งต้น ²³⁸₉₂U (ก้อนกลมสีน้ำเงินเข้ม = นิวตรอน, ฟ้าอ่อน = โปรตอน) ปล่อย Alpha particle (α หรือ ⁴₂He) เหลือนิวเคลียสใหม่ ²³⁴₉₀Th — เลขมวลลด 4 เลขอะตอมลด 2'}],
 key:['Alpha decay เกิดในธาตุหนัก Z &gt; 82: เลขมวล A ลด 4, เลขอะตอม Z ลด 2','แอลฟาเป็น Monoenergetic (2–8 MeV)']},
{n:22,t:'Mechanism of radioactive decay — Beta Particle (β)',short:'Beta (β⁻ / β⁺)',
 body:[{p:'สิ่งสำคัญ: <b>อนุภาคบีตาไม่ได้มีอยู่เดิมในนิวเคลียส</b> แต่ถูกสร้างขึ้นใหม่ขณะเกิดการเปลี่ยนแปลงระหว่างนิวตรอน↔โปรตอนภายในนิวเคลียส แบ่ง 2 รูปแบบ:'},
 {ul:['<b>Negatron (β⁻) emission</b> — ปล่อยบีตาลบ/อิเล็กตรอน: เกิดในนิวเคลียสที่โปรตอนน้อยเกิน (นิวตรอนมากเกิน, n/p สูง) นิวตรอนเปลี่ยนเป็นโปรตอน ปล่อย β⁻ และแอนตินิวทริโน (ν̄) → <b>Z เพิ่ม 1, A เท่าเดิม</b>','<b>Positron (β⁺) emission</b> — ปล่อยโพซิตรอน/บีตาบวก: เกิดในนิวเคลียสที่โปรตอนมากเกิน (n/p ต่ำ) ต้องการนิวตรอนเพิ่ม โปรตอนเปลี่ยนเป็นนิวตรอน ปล่อย β⁺ และนิวทริโน (ν) → ต้องมีพลังงานส่วนต่างของนิวเคลียส<b>อย่างน้อย 1.022 MeV</b> จึงเกิดได้']},
 {fx:'¹³¹₅₃I  →  ¹³¹₅₄Xe + β⁻ + ν̄'},
 {note:'สไลด์ต้นฉบับพิมพ์ผิดเล็กน้อยเป็น “Positron (3+) emission” และ “นิวเคลียสม” ซึ่งหมายถึง β⁺ และนิวเคลียส'},
 {fig:'ภาพบน (Beta Radiation): การสลายตัว β⁻ ของ ¹⁴₆C กลายเป็น ¹⁴₇N พร้อมปล่อย Beta particle (⁰₋₁e) จำนวนนิวคลีออนรวม (14) ไม่เปลี่ยน แต่โปรตอนเพิ่ม 1 · แถบล่าง: สมการ β⁻ ของ ¹³¹₅₃I → ¹³¹₅₄Xe + β⁻ + ν̄ (เป็น Isobar กันตามที่เรียนในสไลด์ 15)'}],
 key:['บีตาไม่ได้อยู่ในนิวเคลียสตั้งแต่แรก แต่เกิดจากการแปลง n ↔ p','Positron (β⁺) emission มี Threshold energy อย่างน้อย 1.022 MeV']},
{n:23,t:'Mechanism of radioactive decay — Electron Capture (EC)',short:'Electron Capture (EC)',
 body:[{p:'เชื่อมจากสไลด์ 22: ถ้านิวเคลียสมี<b>โปรตอนมากเกิน (n/p ต่ำ)</b> แต่พลังงานส่วนต่าง<b>น้อยกว่า 1.022 MeV</b> จนเกิด Positron decay ไม่ได้ จะใช้กลไก <b>Electron Capture (EC — การจับอิเล็กตรอน)</b> แทน'},
 {p:'<b>กลไก</b>: นิวเคลียสดึงอิเล็กตรอนจากวงโคจรชั้นใน (ส่วนใหญ่คือ <b>K-shell</b>) เข้ามารวมกับโปรตอน กลายเป็นนิวตรอนและปล่อย Neutrino (นิวทริโน, ν):'},
 {fx:'p + e⁻ → n + ν'},
 {fx:'¹²⁵₅₃I + ⁰₋₁e  →(T½ = 59.4 วัน)→  ¹²⁵₅₂Te + ν + 35.5 keV'},
 {note:'บนสไลด์พิมพ์เฉพาะ ⁰₋₁ โดยเว้นสัญลักษณ์ e และใช้ตัว υ แทน ν'},
 {p:'<b>การถ่ายเทพลังงาน</b>: แม้นิวทริโนถูกปล่อยพร้อมโมเมนตัมสูง แต่พลังงานส่วนใหญ่<b>ไม่ได้ไปกับนิวทริโน</b> หากยังค้างอยู่ใน Daughter nucleus (นิวเคลียสลูก) ทำให้ อยู่ใน Excited state (สภาวะกระตุ้น) และต้องลดระดับพลังงานกลับสู่ Ground state (สภาวะพื้นฐาน) ได้ 2 วิธีหลัก:'},
 {ol:['<b>Gamma ray emission</b> (การปล่อยรังสีแกมมา)','<b>Internal Conversion Electrons</b> (การแปลงภายใน): นิวเคลียสถ่ายเทพลังงานส่วนเกินให้อิเล็กตรอนวงในโดยตรง ทำให้อิเล็กตรอนหลุดออกจากอะตอม']},
 ],
 key:['EC เกิดในนิวเคลียสโปรตอนเกินและพลังงาน &lt; 1.022 MeV โดยดึงอิเล็กตรอนจาก K-shell เป็นหลัก','ผลลัพธ์: Z ลด 1, A เท่าเดิม และมักตามด้วยการคายพลังงานของนิวเคลียสลูกผ่าน Gamma emission หรือ Internal conversion']},
{n:24,t:'Mechanism of radioactive decay — Gamma Emission',short:'Gamma Emission',
 body:[{p:'<b>Gamma Emission</b>: นิวเคลียสในสภาวะกระตุ้นคายพลังงานส่วนเกินในรูปโฟตอนคลื่นแม่เหล็กไฟฟ้า โดย<b>เลขมวล (A) และเลขอะตอม (Z) ไม่เปลี่ยน</b> ส่วนใหญ่เกิดระหว่างหรือหลังการสลายตัว α, β หรือ EC'},
 {ul:['<b>Cobalt-60 (⁶⁰Co)</b>: แหล่งกำเนิดแกมมาสำคัญทางรังสีรักษา แม้สลายตัวแบบ β⁻ ก่อน แต่อานุภาคบีตาพลังงานต่ำถูกหยุดไว้ภายในหัวเครื่อง (Treatment head) ทั้งหมด จึงถือเป็นแหล่งแกมมาบริสุทธิ์ โฟตอน 2 ค่าพลังงาน: <span class="fx">1.17 MeV</span> และ <span class="fx">1.33 MeV</span> (Mean ≈ <span class="fx">1.25 MeV</span>)','<b>Metastable Nuclear Isomer</b> เช่น ⁹⁹ᵐTc ค้างในสภาวะพลังงานสูงชั่วระยะหนึ่ง แล้วค่อย ๆ ปล่อยแกมมากลับสู่ Ground state เรียกว่า Isomeric transition']},
 {fx:'⁶⁰₂₇Co → ⁶⁰₂₈Ni + ⁰₋₁β + ν̄ + 0.31 MeV + 1.17 MeV + 1.33 MeV'},
 {note:'<b>จุดผิดพลาดบนสไลด์ต้นฉบับ</b>: สมการพิมพ์ “Mi” แทน “Ni” และระบุ T½ เป็น “59.4 d” ซึ่งคาดว่าคัดลอกค้างจากสมการ ¹²⁵I ในสไลด์ 23 — ค่าครึ่งชีวิตจริงของ ⁶⁰Co คือประมาณ <b>5.27 ปี</b> ควรยึดข้อเท็จจริงทางฟิสิกส์และตรวจสอบกับอาจารย์ผู้สอน'},
 {fig:'แผนภาพ Gamma Rays: ⁶⁰₂₇Co ปล่อย Beta radiation กลายเป็น ⁶⁰₂₈Ni* ใน Highly energized state จากนั้นปล่อย Gamma rays 2 เส้น กลายเป็น ⁶⁰₂₈Ni ใน Stable state'}],
 key:['Gamma emission ไม่เปลี่ยน A และ Z — เป็นเพียงการคายพลังงานส่วนเกินของนิวเคลียส','พลังงานแกมมาของ ⁶⁰Co: 1.17 และ 1.33 MeV (เฉลี่ย 1.25 MeV)']},
{n:25,t:'Mechanism of radioactive decay — Proton Heavy Nucleus: EC vs β⁺ (ตัวอย่าง F-18)',short:'F-18: EC vs β⁺ + Annihilation',
 body:[{p:'เปรียบเทียบ 2 เส้นทางสลายตัวที่แข่งขันกันในนิวเคลียสที่มีโปรตอนมากเกิน โดยใช้ <b>¹⁸₉F (ฟลูออรีน-18)</b> ซึ่งใช้บ่อยในการตรวจ <b>PET scan</b> เป็นตัวอย่าง:'},
 {viz:'f18'},
 {ul:['<b>เส้นทางบน — Electron Capture (EC)</b>: ¹⁸₉F ดูดกลืนอิเล็กตรอนในวงโคจรเข้าไปรวมกับโปรตอนกลายเป็นนิวตรอน → ¹⁸₈O · NOTE บนภาพ: ช่องว่างในวงโคจร (Empty orbital) จาก EC ทำให้อิเล็กตรอนวงนอกตกลงมาแทนที่ เกิด <b>Auger electron (ออเจร์อิเล็กตรอน)</b> หรือ <b>Characteristic X-ray (รังสีเอกซ์ลักษณะเฉพาะ)</b> ตามมา','<b>เส้นทางล่าง — Positron (β⁺) Decay + Annihilation</b>: โปรตอนเปลี่ยนเป็นนิวตรอนผ่านอันตรกิริยาแรงนิวเคลียร์อย่างอ่อน (Weak force interactions) ได้ ¹⁸₈O และปล่อย β⁺ (anti-electron/โพซิตรอน) · เมื่อโพซิตรอนไปชนอิเล็กตรอนธรรมดาในอะตอมข้างเคียง เกิด <b>Annihilation (การประลัย)</b> มวลทั้งคู่เปลี่ยนเป็นพลังงานทั้งหมด ปล่อยโฟตอนแกมมา <b>2 ลำพุ่งสวนทางกัน 180°</b> แต่ละลำพลังงาน <span class="fx">hν = 0.511 MeV</span>']},
 {note:'บนภาพสะกด Annihilation เป็น “anihilation” และมีลูกศรชี้วงกลม n แสดงการเกิดนิวตรอนในกระบวนการ β⁺'}],
 key:['หลัง EC เกิดช่องว่างในชั้นอิเล็กตรอน → ตามด้วย Characteristic X-ray หรือ Auger electron','หลัง β⁺ decay โพซิตรอนเกิด Annihilation กับอิเล็กตรอน ให้โฟตอน 2 ตัว ตัวละ 0.511 MeV — หลักการพื้นฐานของเครื่อง PET scan']},
{n:26,t:'Mechanism of radioactive decay — Internal Conversion',short:'Internal Conversion',
 body:[{p:'<b>Internal Conversion (การแปลงภายใน)</b> คือกลไกที่<b>แข่งขันโดยตรงกับ Gamma emission</b> ในการลดระดับพลังงานของนิวเคลียสใน Excited state: แทนที่จะคายพลังงานเป็นโฟตอนแกมมา นิวเคลียสจะ<b>ถ่ายเทพลังงานส่วนเกินให้อิเล็กตรอนวงใน (เช่น K-shell) โดยตรง</b> ทำให้อิเล็กตรอนหลุดกระเด็นออก (Conversion electron)'},
 {fx:'E<sub>k</sub> (conversion electron) = E<sub>excess</sub> − E<sub>b</sub>  (พลังงานส่วนต่างที่เกินจาก Binding energy ของชั้นนั้น)'},
 {fig:'ภาพซ้าย — Decay scheme ของ ²⁰³₈₀Hg (ครึ่งชีวิต 47 วัน) สลายตัว β⁻ (พลังงานสูงสุด 214 keV) กลายเป็น ²⁰³₈₁Tl* ในสภาวะกระตุ้นที่มีพลังงานเกิน 279 keV แม้จะปล่อยแกมมา 279 keV ลงมาเป็น ²⁰³₈₁Tl ได้ แต่บ่อยครั้งจะถ่ายเทพลังงานให้อิเล็กตรอนชั้นในแทน (ข้อความบรรทัดล่างถูกตัดขอบเล็กน้อย ใจความครบ) · ภาพขวา — แผนภาพอะตอม ²⁰³₈₁Tl* ถ่ายเทพลังงานโดยตรง (รัศมีสีชมพู) ไปยังอิเล็กตรอนชั้น K ทำให้อิเล็กตรอนพุ่งทะลุชั้น L และ M หลุดออก เหลือช่องว่างในชั้น K'}],
 key:['Internal conversion แข่งกับ Gamma emission และ<b>ไม่ใช่</b>การที่นิวเคลียสปล่อยแกมมาออกมาชนอิเล็กตรอน (ต่างจาก Photoelectric) แต่เป็นการถ่ายเทพลังงานโดยตรงจากนิวเคลียสสู่อิเล็กตรอนวงโคจร','อิเล็กตรอนที่หลุดมีพลังงานจลน์ = E_excess − E_b']},
{n:27,t:'Mechanism of radioactive decay — Mathematics of Radioactive Decay',short:'คณิตศาสตร์การสลายตัว',
 body:[{p:'หน่วยวัด <b>Radioactivity (กัมมันตภาพรังสี)</b> และสมการพื้นฐานคำนวณปริมาณสารกัมมันตรังสีที่เหลือตามเวลา:'},
 {ul:['<span class="fx">1 Curie (Ci) = 3.7×10¹⁰</span> disintegrations per second (การสลายตัวต่อวินาที) — หน่วยดั้งเดิมยังใช้แพร่หลายในคลินิก','<span class="fx">1 Becquerel (Bq) = 1</span> disintegration per second — เป็น <b>SI unit</b>']},
 {fx:'N<sub>t</sub> = N₀·e<sup>−λt</sup>  และ  A<sub>t</sub> = A₀·e<sup>−λt</sup>'},
 {fx:'T½ = ln2/λ  (ln2 ≈ 0.693)'},
 {p:'โดย N₀, A₀ = จำนวนอะตอมและกัมมันตภาพเริ่มต้น, N_t, A_t = ที่เวลา t, λ = Decay constant (ค่าคงที่การสลายตัว)'},
 {note:'บนสไลด์พิมพ์ “In2” ซึ่งหมายถึงลอการิทึมธรรมชาติ ln2'}],
 key:['1 Ci = 3.7×10¹⁰ Bq — Bq คือหน่วย SI แต่ Ci ยังนิยมใช้ในคลินิก','การสลายตัวเป็น Exponential decay และ T½ แปรผกผันกับ λ']},
{n:28,t:'การจำแนกอนุภาค (Charged vs Uncharged & Light vs Heavy)',short:'จำแนกอนุภาค 2 เกณฑ์',
 body:[{p:'ก่อนเข้าสู่กลไกที่อนุภาคทำปฏิกิริยากับสสาร ให้จัดหมวดรังสีอนุภาคและโฟตอนตามคุณสมบัติ 2 เกณฑ์ เพราะ<b>ประจุและมวลเป็นตัวกำหนดลักษณะการชนและการถ่ายเทพลังงานในเนื้อเยื่อ</b>:'},
 {viz:'classgrid'}],
 key:['ประจุไฟฟ้าแยกระหว่าง Directly ionizing (มีประจุ) กับ Indirectly ionizing (ไม่มีประจุ เช่น โฟตอนและนิวตรอน)','มวลแยกระหว่างอนุภาคเบา (β⁻, β⁺) กับอนุภาคหนัก (p⁺, n, α, heavy ions)']},
{n:29,t:'พฤติกรรมการทะลุผ่านของ Photons เทียบกับ Protons',short:'Photons vs Protons ในตัวกลาง',
 body:[{p:'เปรียบเทียบผลลัพธ์เชิงฟิสิกส์เมื่อลำรังสี<b>ไม่มีประจุ (Photons)</b> กับ<b>มีประจุ (Protons)</b> เคลื่อนที่ผ่านตัวกลาง — ความแตกต่างพื้นฐานระหว่างการฉายรังสีด้วยโฟตอน (X-ray/Gamma) กับการบำบัดด้วยโปรตอน (Proton therapy):'},
 {ul:['<b>ไม่มีประจุ (Photons)</b>: อันตรกิริยาทางอ้อม อำนาจทะลุผ่านสูง แต่ LET (Linear Energy Transfer) ต่ำ','<b>มีประจุ (Protons)</b>: อันตรกิริยาโดยตรงต่อเนื่อง พิสัยสั้น (Finite range) และ LET สูง']},
 {fig:'แผนภาพ 2 แถว รังสีพุ่งจากอากาศ (ซ้ายสีขาว) เข้าตัวกลาง (ขวาสีน้ำเงิน) — แถวบน Photons (สี่เหลี่ยม “X”): เกิด <b>Attenuation (การลดทอน)</b> จำนวนโฟตอน (Fluence) ค่อย ๆ ลดเพราะบางตัวถูกดูดกลืน/กระเจิง แต่ตัวที่รอดผ่านไปยังพลังงานต่อโฟตอนเท่าเดิม (Less photons in beam / Same energy per photon) · แถวล่าง Protons (สี่เหลี่ยม “p”): เกิด <b>Stopping (การหยุดยั้ง)</b> จำนวนโปรตอนเท่าเดิมตลอดเส้นทาง แต่สีจางลง (แดง→ม่วง→ชมพูอ่อน) สื่อว่าทุกตัวค่อย ๆ เสียพลังงานจลน์จนหมดและหยุด (STOP) พร้อมกันที่ระยะลึกหนึ่งชัดเจน (Same number of protons / Less energy per proton)'}],
 key:['Photons = Attenuation (จำนวนลด แต่พลังงานต่อโฟตอนที่เหลือเท่าเดิม ทะลุลึก ไม่มีระยะหยุดตายตัว)','Protons = Stopping (จำนวนเท่าเดิม แต่พลังงานต่ออนุภาคลดจนหยุดที่ระยะจำเพาะ)']},
{n:30,t:'Charged Particle Specifications — W · Specific Ionization · Stopping Power · LET',short:'W · SI · Stopping · LET',
 body:[{p:'พารามิเตอร์เชิงปริมาณ 4 ตัว วัดและอธิบายการสูญเสียพลังงานและการสร้างความเสียหายในตัวกลางของ Charged Particles:'},
 {viz:'defs'}],
 key:['W ของอากาศแห้งที่ STP ≈ 33.97 eV ต่อการสร้างไอออน 1 คู่','Stopping power มองพลังงานที่<b>อนุภาคสูญเสีย</b>ต่อระยะทาง ส่วน LET มองพลังงานที่<b>ตัวกลางดูดซับไว้เฉพาะที่</b>ต่อระยะทาง (สัมพันธ์โดยตรงกับความเสียหายทางชีวภาพของ DNA)']},
{n:31,t:'Heavy Charged Particle Interactions — ภาพรวม 2 ประเภทหลัก',short:'อันตรกิริยาอนุภาคหนัก: ภาพรวม',
 body:[{p:'<b>Heavy Charged Particle Interactions</b>: หลักการเหมือนกันทั้งโปรตอน (p⁺) และอนุภาคหนักอื่น เช่น แอลฟา (α), Carbon ions, Neon ions และไอออนหนักชนิดอื่น แบ่ง 2 ประเภทหลัก:'},
 {ol:['<b>Inelastic collision with electrons</b> (การชนแบบไม่ยืดหยุ่นกับอิเล็กตรอน)','<b>Nuclear interactions</b> (การปฏิสัมพันธ์กับนิวเคลียส)']},
 {fig:'การ์ตูน 2 กรอบ — กรอบบน (เขียว): อนุภาคหนักประจุบวก (+) วิ่งผ่านอะตอมคาร์บอน (C) ดึงดูด/ชนอิเล็กตรอนวงนอก ตัวหนึ่งหลุดกระเด็น (“AHHH!!!” = Ionization) อีกตัวสั่นสะเทือน (Excitation) ตรงกับประเภท 1 · กรอบล่าง (เหลือง “Electron collisions with nucleus”): เปรียบเทียบอิเล็กตรอน (อนุภาคเบา) กับนิวเคลียส 2 กรณี — Inelastic collision with nucleus: อิเล็กตรอนวิ่งเฉียดนิวเคลียส เบี่ยงเบน ช้าลง (“WEEEEE!!!”) ปล่อยโฟตอน BREMSSTRAHLUNG PHOTON พลังงาน hν = พลังงานอิเล็กตรอนก่อนเบี่ยงเบน − หลังเบี่ยงเบน / Elastic collision with nucleus: ชนแล้วสะท้อน (“Ouch!”) ความเร็วเท่าเดิม ไม่ปล่อยโฟตอน'},
 {note:'บนภาพสะกด BREMSSTRAHLUNG ผิดเป็น “BREMSSTRAHLUING”'}],
 key:['อันตรกิริยาอนุภาคหนักมีประจุแบ่ง 2 ทาง: ชนอิเล็กตรอน (Inelastic collision) และชนนิวเคลียส (Nuclear interactions)','ภาพล่างทบทวนกลไก Bremsstrahlung จากการชนแบบไม่ยืดหยุ่นระหว่างอิเล็กตรอนกับนิวเคลียส']},
{n:32,t:'Heavy Charged Particle Interactions — Inelastic collision with electron',short:'ชนอิเล็กตรอน (Inelastic)',
 body:[{p:'ขยายกลไกที่ 1: เมื่อ Heavy particle วิ่งผ่านสสาร จะเกิดแรงทางไฟฟ้าและชนกับ <b>Orbital electrons (อิเล็กตรอนวงนอก)</b> ของอะตอมในตัวกลาง ส่งผลต่อเนื่อง 4 ประการ:'},
 {ol:['<b>Ionization (การแตกตัวเป็นไอออน)</b>: อิเล็กตรอนได้รับพลังงานสูงพอจนหลุดจากอะตอม','<b>Excitation (การกระตุ้นอะตอม)</b>: ได้พลังงานไม่พอหลุด จึงย้ายขึ้นวงโคจรที่สูงขึ้นชั่วคราว','<b>Stopping Power เพิ่มขึ้น</b>: สูญเสียพลังงานต่อระยะทางอย่างรวดเร็ว (โดยเฉพาะเมื่ออนุภาคช้าลงใกล้หยุด)','<b>High LET</b>: ถ่ายเทพลังงานลงเนื้อเยื่ออย่างหนาแน่น สร้างความเสียหายต่อเซลล์รุนแรง']},
 {fig:'ภาพขยายของกรอบเขียวจากสไลด์ 31: อนุภาค (+) เคลื่อนที่ผ่านอะตอมคาร์บอน (C) ทำให้อิเล็กตรอนวงนอกหลุดเป็นไอออน (Ionization — “AHHH!!!”) และอีกตัวถูกกระตุ้นจนสั่น (Excitation)'}],
 key:['การชนแบบไม่ยืดหยุ่นกับอิเล็กตรอนวงนอกเกิดทั้ง Ionization และ Excitation และเป็นสาเหตุของ High LET ในอนุภาคหนักมีประจุ']},
{n:33,t:'Heavy Charged Particle Interactions — Nuclear Interactions',short:'ชนนิวเคลียส + Neutron shielding',
 body:[{p:'ขยายกลไกที่ 2: อนุภาคหนักพุ่งชน<b>นิวเคลียสของอะตอมในตัวกลางโดยตรง</b> แบ่งผลลัพธ์ 2 รูปแบบ:'},
 {ul:['<b>Elastic scattering (การกระเจิงแบบยืดหยุ่น)</b>: นิวเคลียสไม่แตก แต่อนุภาคหนักเปลี่ยนทิศทาง → ลำรังสี (Beam) เบี่ยงเบน/กระจายกว้างออก','<b>Non-elastic nuclear reactions</b>: พลังงานจลน์ถ่ายเทเข้านิวเคลียสจนเกิด <b>Nuclear fragmentation (การแตกตัวของนิวเคลียส)</b> ปลดปล่อยอนุภาคทุติยภูมิชนิดใหม่: นิวตรอน (n), แกมมา (γ), โปรตอน (p⁺), แอลฟา (α)']},
 {note:'บนสไลด์ สัญลักษณ์ γ หลังตัว n แสดงผลเว้นว่าง แต่บริบทของการแตกตัวนิวเคลียสคือ n, γ, p⁺, α'},
 {p:'<b>ผลกระทบเชิงปฏิบัติในคลินิก</b>: เพราะการแตกตัวปล่อย<b>นิวตรอน</b>เป็นผลพลอยได้ การออกแบบ Shielding (กำบังรังสี) สำหรับห้องฉายรังสี <b>Proton therapy หรือ Carbon therapy จึงต้องออกแบบกำบังนิวตรอนร่วมด้วยเสมอ</b>'}],
 key:['Nuclear fragmentation ปลดปล่อยรังสีทุติยภูมิ โดยเฉพาะ Neutron','ห้องรักษาด้วย Proton หรือ Carbon ion จำเป็นต้องมี Neutron shielding ด้วย']},
{n:34,t:'Nuclear Interactions — จำแนกประเภทของ Neutrons ตามพลังงาน',short:'ชนิดนิวตรอนตามพลังงาน',
 body:[{p:'เนื่องจากนิวตรอน<b>ไม่มีประจุไฟฟ้า</b> จึงไม่เกิดแรงผลัก/แรงดูดทางไฟฟ้ากับอิเล็กตรอนหรือนิวเคลียส และจะทำปฏิกิริยาเฉพาะเมื่อ<b>ชนนิวเคลียสโดยตรง</b>เท่านั้น — ความเร็ว (หรือพลังงาน) จึงเป็นปัจจัยสำคัญที่สุดกำหนดรูปแบบอันตรกิริยา แบ่ง 2 ช่วง:'},
 {ul:['<b>Thermal neutrons (นิวตรอนช้า/นิวตรอนความร้อน)</b>: พลังงานต่ำมาก ≈ <span class="fx">0.025 eV</span> — ระดับพลังงานความร้อนทั่วไปที่อุณหภูมิห้อง','<b>Fast neutrons (นิวตรอนเร็ว)</b>: พลังงานสูงกว่ามาก ช่วง <span class="fx">keV ถึง MeV</span>']},
 {note:'หัวข้อบนสไลด์ยังใช้หัวข้อกลุ่มเดิม “Heavy Charged Particle Interactions” แต่เนื้อหาสไลด์ 34–38 เป็นเรื่อง Neutron ซึ่งเป็นอนุภาคหนักที่<b>ไม่มีประจุ</b>'}],
 key:['พลังงานกำหนดชนิดอันตรกิริยา: Thermal ≈ 0.025 eV ส่วน Fast = keV–MeV']},
{n:35,t:'Fast neutrons — Elastic collision with hydrogen',short:'Fast n + H → Recoil proton',
 body:[{p:'กลไกแรกที่สำคัญที่สุดของ <b>Fast neutrons</b> ในเนื้อเยื่อชีวภาพ (มีน้ำและไฮโดรเจนเป็นองค์ประกอบหลัก): <b>Elastic collision with hydrogen (การชนแบบยืดหยุ่นกับนิวเคลียสไฮโดรเจน)</b> — นิวตรอนกับโปรตอน (นิวเคลียส H) มวลใกล้เคียงกันมาก การชนจึงถ่ายเทพลังงานได้มีประสิทธิภาพสูงสุด (เหมือนลูกบิลเลียดชนกัน) เกิด Water ionization (การแตกตัวของโมเลกุลน้ำ)'},
 {fig:'นิวตรอนเร็ว (การ์ตูน N) พุ่งชนอะตอมไฮโดรเจน (H) ของ Water molecule (H₂O) — ข้อความบรรทัดบนถูกตัดขอบเล็กน้อยแต่อ่านใจความครบ · ผลลัพธ์ 2 ส่วน: (1) นิวเคลียสไฮโดรเจนถูกดีดหลุดเป็น <b>Recoil proton (โปรตอนกระดอน)</b> มีประจุบวกและเป็นอิสระ เคลื่อนที่ไปสร้างความเสียหาย/ก่อไอออนต่อเองได้ (กลไก Indirectly ionizing ของนิวตรอน) (2) โมเลกุลน้ำที่เสียไฮโดรเจนเหลือ <b>OH⁻ (hydroxyl)</b> ระบุบนภาพว่า “very reactive in tissue!!!” — ไวต่อปฏิกิริยาเคมีสูงมาก ก่ออันตรายต่อโมเลกุลชีวภาพได้'}],
 key:['Fast neutron ชนไฮโดรเจนในน้ำแบบยืดหยุ่น ได้ Recoil proton (ไปทำลายเนื้อเยื่อต่อแบบ High LET) และ Hydroxyl ที่ไวต่อปฏิกิริยาสูง']},
{n:36,t:'Fast neutrons — Inelastic scatter',short:'Fast n: Inelastic scatter → γ',
 body:[{p:'กลไกที่ 2: <b>Inelastic scatter (การกระเจิงแบบไม่ยืดหยุ่น)</b> เกิดเมื่อนิวตรอนเร็วพุ่งชนนิวเคลียสที่ใหญ่กว่าไฮโดรเจน นิวตรอนถ่ายเทพลังงานส่วนหนึ่งไปกระตุ้นนิวเคลียส แล้วกระเด็นออกพร้อมพลังงานที่ลดลง ส่วนนิวเคลียสที่ถูกกระตุ้นปลดปล่อยพลังงานส่วนเกินเป็น <b>Gamma ray (รังสีแกมมา)</b>'},
 {fig:'ภาพซ้าย: นิวตรอนเร็ว (N) พุ่งเข้าหานิวเคลียสประจุบวก (+) · ภาพขวา: หลังชนแบบไม่ยืดหยุ่น นิวตรอนสะท้อนเฉียงขึ้นด้วยพลังงานน้อยลง ขณะที่นิวเคลียสปลดปล่อยคลื่นโฟตอน hν (Gamma ray) ออกทางขวา'}],
 key:['ใน Inelastic scatter นิวเคลียสยังเป็นธาตุเดิม แต่ปล่อย Gamma ray (hν) เพื่อลดพลังงานส่วนเกิน']},
{n:37,t:'Fast neutrons — Neutron inelastic collision with carbon',short:'Fast n + ¹²C → 3α',
 body:[{p:'ตัวอย่างเฉพาะปฏิกิริยานิวเคลียร์เมื่อ Fast neutron ชนแบบไม่ยืดหยุ่นกับ <b>Carbon-12 (¹²C: 6 โปรตอน + 6 นิวตรอน)</b> ธาตุหลักอีกชนิดในเนื้อเยื่อมนุษย์: นิวเคลียสคาร์บอนแตกออกเป็น<b>อนุภาคแอลฟา 3 ตัว (Three alpha particles, 3α)</b> — แอลฟาแต่ละตัวเป็น Densely ionizing charged particles (อนุภาคมีประจุที่ก่อไอออนหนาแน่นสูง / High LET) จึงสร้างความเสียหายทางชีวภาพรุนแรงในระยะสั้น'},
 {fig:'นิวเคลียสคาร์บอนแตกกระจายเป็นก้อนนิวเคลียสสีดำ 3 ก้อน (แทน α แต่ละก้อนมี 2 นิวตรอน “N N” + 2 โปรตอน “P+ P+”) หลังถูกนิวตรอนเร็ว (N) พุ่งชนแล้วนิวตรอนพุ่งผ่านออกไปทางขวา'}],
 key:['Fast neutron ชน ¹²C ทำให้คาร์บอนแตกเป็น 3 Alpha particles ซึ่งมี High LET สูงมาก']},
{n:38,t:'Slow neutrons — Radiative Capture & Transmutation',short:'Slow n: Capture / Transmutation',
 body:[{p:'เมื่อ <b>Slow neutrons (นิวตรอนช้า/Thermal)</b> เคลื่อนที่ช้า ๆ เข้าใกล้นิวเคลียส นิวเคลียสดูดจับนิวตรอนเข้าไปได้ง่าย เกิด 2 กระบวนการหลัก:'},
 {ul:['<b>Radiative Capture (การจับนิวตรอนแบบแผ่รังสี)</b>: ดูดกลืนนิวตรอน → เลขมวลเพิ่ม 1 AMU (ไอโซโทปที่หนักขึ้นของธาตุเดิม) ไม่เกิดการเปลี่ยนแปลงอนุภาคอื่น นอกจากปล่อย<b>รังสีแกมมา</b>ระบายพลังงานส่วนเกิน','<b>Transmutation (การแปลงธาตุ)</b>: ดูดกลืนนิวตรอนเช่นกัน แต่ตามมาด้วย<b>คายโปรตอน (p⁺) หรือแอลฟา (α)</b> → เลขอะตอมเปลี่ยน <b>ธาตุเปลี่ยนชนิด</b>']},
 {fig:'การ์ตูนตัวอย่าง Transmutation: นิวตรอนช้า (N) เข้าไปในนิวเคลียสกำมะถัน-32 (³²₁₆S รูปคล้าย Pac-Man อ้าปากกลืนนิวตรอน) จากนั้นคาย Proton (+) 1 ตัว เปลี่ยนธาตุเป็นฟอสฟอรัส-32 (³²₁₅P) เลขมวล 32 เท่าเดิม แต่เลขอะตอมลด 16 → 15'},
 {fx:'³²₁₆S + n → ³²₁₅P + p⁺'}],
 key:['Radiative Capture: ดูด n → มวลเพิ่ม 1 (ธาตุเดิม) + ปล่อย γ','Transmutation: ดูด n → คาย p⁺ หรือ α → เปลี่ยนชนิดธาตุ (เช่น ³²₁₆S + n → ³²₁₅P + p⁺)']},
{n:39,t:'Interaction of X-Radiation With Matter',short:'คั่น: X-ray กับสสาร',div:true,
 body:[{p:'หน้าคั่นหัวข้อใหญ่ที่ 2 เปลี่ยนจากการศึกษาอนุภาครังสีเข้าสู่ <b>Interaction of X-Radiation With Matter</b> (การกำเนิดและอันตรกิริยาของรังสีเอกซ์/โฟตอนกับสสาร)'}],
 key:['เป็นหน้าคั่นเปลี่ยนหัวข้อใหญ่ ไม่มีเนื้อหาบรรยายเพิ่มเติม']},
{n:40,t:'Recap — Production of X-Ray & Photon Interaction',short:'Recap: แหล่งกำเนิด & 5 อันตรกิริยา',
 body:[{p:'ทบทวนกรอบเนื้อหาของส่วนที่ 2 ทั้งหมด แบ่ง 2 กลุ่มหลัก:'},
 {ul:['<b>Source of X-ray / Electromagnetic radiation</b> (แหล่งกำเนิดโฟตอนพลังงานสูง): Gamma Rays following beta decay (แกมมาหลังการสลายตัวบีตา) · Annihilation radiation (รังสีจากการประลัย) · Bremsstrahlung (รังสีเบรมสตราลุง/รังสีจากการเบรก) · Characteristic X-ray (รังสีเอกซ์ลักษณะเฉพาะ)','<b>Photon Interaction</b> (อันตรกิริยาของโฟตอนกับสสาร 5 ชนิด): Thomson-Rayleigh (หรือ Coherent scatter) · Photoelectric (โฟโตอิเล็กทริก) · Compton (คอมป์ตัน) · Pair Production (การผลิตคู่) · Photodisintegration (การแตกตัวนิวเคลียสด้วยโฟตอน)']}],
 key:['ต้องรู้จักทั้งแหล่งกำเนิดโฟตอน และอันตรกิริยาของโฟตอนกับสสารทั้ง 5 แบบ เรียงตามพลังงานต่ำไปสูง']},
{n:41,t:'การเกิด Characteristic X-rays (FIGURE 7-3)',short:'Characteristic X-ray (3 ขั้น)',
 body:[{p:'กลไกผลิต <b>Characteristic X-ray (รังสีเอกซ์ลักษณะเฉพาะ)</b> ซึ่งมีพลังงานเฉพาะตัวเท่ากับ<b>ผลต่างของพลังงานยึดเหนี่ยวระหว่างวงโคจรอิเล็กตรอน</b>ของธาตุเป้าหมาย — กดเล่นทีละขั้นในแผนภาพโต้ตอบด้านล่าง'},
 {sim:'charx'},
 {fig:'FIGURE 7-3 ลำดับ 3 ภาพต่อเนื่อง — ซ้าย: Projectile electron (อิเล็กตรอนยิงเป้าความเร็วสูง) ชนอิเล็กตรอนชั้น K ของอะตอมเป้า ทำให้หลุดกระเด็น (Ionized K-shell electron) เกิดช่องว่าง (Vacancy) ในชั้น K (ขอบซ้ายภาพแรกถูกตัดตัวอักษรบางส่วน อ่านได้จากภาพ 2–3) · กลาง: อิเล็กตรอนชั้นนอกกระโดดลงมาเติมช่องว่างชั้น K พร้อมปล่อยพลังงานส่วนต่างเป็น Characteristic x-ray · ขวา: เมื่อชั้นนอกตกลงมาแทนที่ชั้น K เกิดช่องว่างใหม่ อิเล็กตรอนชั้นถัดไปตกมาเติมต่อเป็นทอด ๆ (Cascade) ปล่อย Characteristic x-ray เพิ่มเติมพลังงานต่ำลงกว่าเส้นแรก'}],
 key:['Characteristic X-ray เกิดจากอิเล็กตรอนชั้นใน (เช่น K-shell) ถูกทำให้แตกตัวเป็นไอออน แล้วอิเล็กตรอนชั้นนอกตกลงมาเติมช่องว่าง — พลังงานรังสีเอกซ์ = ผลต่าง Binding energy ระหว่างสองชั้น']},
{n:42,t:'Sources of Electromagnetic Radiation',short:'คั่น: แหล่งกำเนิดรังสี',div:true,
 body:[{p:'หน้าคั่นหัวข้อย่อยสำหรับ <b>Sources of Electromagnetic Radiation</b> (แหล่งกำเนิดของรังสีแม่เหล็กไฟฟ้า)'}],
 key:['เป็นหน้าคั่นเปลี่ยนหัวข้อ ไม่มีเนื้อหาบรรยายเพิ่มเติม']},
{n:43,t:'Sources of Electromagnetic Radiation — แหล่งกำเนิด 5 ประเภท',short:'แหล่งกำเนิด 5 ประเภท',
 body:[{p:'รายชื่อแหล่งกำเนิดของ Electromagnetic Radiation (รังสีแม่เหล็กไฟฟ้าก่อไอออน) 5 แหล่งสำคัญในฟิสิกส์รังสี:'},
 {viz:'sources'}],
 key:['ข้อ 1–3 เกี่ยวข้องกับนิวเคลียสหรือปฏิอนุภาค ส่วนข้อ 4–5 (Bremsstrahlung และ Characteristic X-rays) คือกลไกหลักในการผลิตรังสีเอกซ์ในหลอดเอกซเรย์ทางการแพทย์']},
{n:44,t:'PHOTON INTERACTION',short:'คั่น: Photon Interaction',div:true,
 body:[{p:'หน้าคั่นเข้าสู่หัวข้อหลักสุดท้ายของบทเรียน: <b>PHOTON INTERACTION</b> (อันตรกิริยาของโฟตอนกับสสารทั้ง 5 แบบในสไลด์ 45–49)'}],
 key:['เป็นหน้าคั่นเปลี่ยนหัวข้อ ไม่มีเนื้อหาบรรยายเพิ่มเติม']},
{n:45,t:'Coherent Scatter (Thomson–Rayleigh)',short:'Coherent Scatter',
 body:[{p:'อันตรกิริยาโฟตอนลำดับที่ 1 (พลังงานต่ำสุด): <b>Coherent Scatter (การกระเจิงแบบอาพันธ์)</b> หรือ Thomson-Rayleigh scattering'},
 {ul:['เกิดได้ช่วงพลังงานประมาณ <span class="fx">1 keV – 1 MeV</span> แต่<b>เด่นชัดที่พลังงานต่ำกว่า 10 keV</b>','กลไก: โฟตอนรังสีเอกซ์พลังงานต่ำตกกระทบอะตอม ทำให้อะตอมทั้งหมดสั่นและอยู่ใน Excited state แล้วปลดปล่อยพลังงานส่วนเกินออกมาทันทีเป็น Scattered x-ray (รังสีเอกซ์กระเจิง) ในทิศทางใหม่','จุดเด่น: <b>ไม่สูญเสียพลังงาน และไม่เกิดการแตกตัวเป็นไอออน (No ionization)</b> — ความยาวคลื่นรังสีกระเจิงเท่ากับรังสีตกกระทบ']},
 {fx:'λ = λ′  ดังนั้น  E = E′'},
 {fig:'แผนภาพอะตอม: Incident x-ray ความยาวคลื่น λ พุ่งเข้ากระทบอะตอม เกิด Scattered x-ray เปลี่ยนทิศทางพุ่งเฉียงออกขวาล่าง โดย λ′ = λ และไม่มีอิเล็กตรอนหลุดออกจากอะตอม'}],
 key:['เด่นที่พลังงาน &lt; 10 keV','λ = λ′ และ E = E′ — เปลี่ยนเฉพาะทิศทาง ไม่สูญเสียพลังงาน ไม่ก่อไอออน']},
{n:46,t:'Photoelectric Interaction (Photoelectric Effect / Absorption)',short:'Photoelectric Effect',
 body:[{p:'อันตรกิริยาโฟตอนลำดับที่ 2: <b>Photoelectric Interaction / Photoelectric Effect / Photoelectric Absorption (ปรากฏการณ์โฟโตอิเล็กทริก)</b>'},
 {ul:['เกิดช่วงพลังงานประมาณ <span class="fx">1–150 keV</span> และ<b>เด่นในช่วง 10–26 keV</b>','ความสำคัญทางคลินิก: หัวใจของการสร้าง <b>Image contrast (ความเปรียบต่างของภาพ)</b> ในงาน X-ray และ CT โดยเฉพาะโครงสร้างเลขอะตอม (Z) สูง เช่น กระดูก (แคลเซียม), สารทึบรังสีไอโอดีน (Iodine), แบเรียม (Barium) — โฟตอนถูกดูดกลืนทั้งหมด บริเวณนั้นจึงปรากฏ<b>สีขาวชัดเจน</b>บนภาพถ่ายรังสี']},
 {p:'<b>กลไก 4 ขั้นตอน</b> (ตามหมายเลข 1–4 บนสไลด์):'},
 {steps:[{t:'โฟตอนตกกระทบ (Incident photon) ในช่วง Diagnostic range ชนอิเล็กตรอนวงใน (K หรือ L shell)',b:'ถ่ายเทพลังงาน<b>ทั้งหมด</b>ให้อิเล็กตรอนและดีดหลุดจากวงโคจร โฟตอนตกกระทบหายไปทั้งหมด (“absorbed”)'},{t:'อิเล็กตรอนที่ถูกดีดเรียกว่า Photoelectron (โฟโตอิเล็กตรอน)',b:'ได้พลังงานจลน์ = พลังงานโฟตอนตกกระทบ − พลังงานยึดเหนี่ยวของชั้นนั้น: <span class="fx">E<sub>k</sub> = hν₀ − E<sub>b</sub></span>'},{t:'เกิดช่องว่าง (Vacancy) ในวงโคจรชั้นใน (K หรือ L)',b:'ไม่เสถียรและต้องถูกเติมเต็ม อิเล็กตรอนจากวงนอก (มักชั้นถัดไป) ตกลงมาแทนที่'},{t:'อิเล็กตรอนชั้นนอกตกลงมาแทนที่ช่องว่าง',b:'คายพลังงานส่วนเกินเป็น Secondary photon (โฟตอนทุติยภูมิ / Characteristic X-ray)'}]},
 {fig:'สไลด์ประกอบด้วยกล่องคำอธิบายลำดับเหตุการณ์ 1→2→3→4 ประกอบสมการ E_k = hν₀ − E_b แสดงการดูดกลืนโฟตอนสมบูรณ์ การดีดตัวของ Photoelectron และการเกิด Secondary photon (ในไฟล์แปลงมีเพียงกรอบข้อความ 1–4 และสัญลักษณ์ประจุลบ ⊖ ไม่พบภาพเส้นวงโคจรอะตอมแยกต่างหาก)'}],
 key:['โฟตอนตกกระทบ<b>ถูกดูดกลืนหมด</b> (Total absorption) เกิดกับ<b>อิเล็กตรอนวงใน</b> (K หรือ L shell) ได้ Photoelectron + Characteristic X-ray','เด่นช่วง 10–26 keV และขึ้นกับธาตุ Z สูง (กระดูก, ไอโอดีน, แบเรียม) สร้างคอนทราสต์ให้ภาพเอกซเรย์']},
{n:47,t:'Compton Interaction (Compton Scattering)',short:'Compton Scattering',
 body:[{p:'อันตรกิริยาโฟตอนลำดับที่ 3: <b>Compton Interaction / Compton Scattering (การกระเจิงแบบคอมป์ตัน)</b>'},
 {ul:['เกิดได้ใน<b>ทุกช่วงพลังงาน</b> แต่<b>เด่นที่สุดในช่วง 26 keV – 24 MeV</b> (ครอบคลุมพลังงานหลักของรังสีวินิจฉัยทั่วไปและรังสีรักษา)','กลไก: โฟตอนรังสีเอกซ์ตกกระทบพุ่งชน<b>อิเล็กตรอนวงนอก (Outer-shell electron)</b> และดีดหลุดจากอะตอม → อะตอมไอออไนซ์ อิเล็กตรอนที่หลุดเรียกว่า <b>Compton electron</b> · โฟตอนเดิม<b>ไม่หายไป</b> แต่เสียพลังงานบางส่วนและเปลี่ยนทิศทางกระเจิงเป็น Scattered x-ray ที่พลังงานลดลง (ความยาวคลื่นยาวขึ้น: λ &lt; λ′)']},
 {fx:'E<sub>i</sub> = E<sub>s</sub> + (E<sub>b</sub> + E<sub>KE</sub>)'},
 {p:'โดย E_i = พลังงานรังสีเอกซ์ตกกระทบ, E_s = พลังงานรังสีกระเจิง, E_b = พลังงานยึดเหนี่ยวอิเล็กตรอน, E_KE = พลังงานจลน์ของ Compton electron'},
 {fig:'แผนภาพอะตอม: Incident x-ray ความยาวคลื่น λ ชนอิเล็กตรอนวงนอกสุด หลุดออกเป็น Compton electron (ด้านบน) ส่วนโฟตอนเบี่ยงเบนทำมุม Angle of deflection พุ่งออกขวาล่างเป็น Scattered x-ray ความยาวคลื่นยาวกว่าเดิมชัดเจน (λ &lt; λ′) แสดงว่าพลังงานลดลง'}],
 key:['เกิดกับ<b>อิเล็กตรอนวงนอก</b> เด่นที่สุดในช่วงกว้างมาก 26 keV – 24 MeV','ได้ทั้ง Compton electron และ Scattered x-ray พลังงานลด (λ &lt; λ′) — แหล่งกำเนิดรังสีกระเจิงหลักที่ลดคุณภาพภาพและก่ออันตรายต่อผู้ปฏิบัติงาน']},
{n:48,t:'Pair Production (การผลิตคู่)',short:'Pair Production',
 body:[{p:'อันตรกิริยาโฟตอนลำดับที่ 4 (พลังงานระดับ MeV): <b>Pair Production (การผลิตคู่)</b>'},
 {ul:['กลไก: โฟตอนพลังงานสูงทะลุวงโคจรอิเล็กตรอนเข้าไปทำปฏิกิริยากับ <b>Nuclear field (สนามแรงของนิวเคลียส)</b> โฟตอนหายไปทั้งหมด เปลี่ยนพลังงานเป็นมวล (ตาม E = mc²) สร้างอนุภาค 1 คู่: <b>Electron (e⁻ ประจุลบ)</b> + <b>Positron (e⁺ ประจุบวก)</b>','<b>Threshold energy</b>: มวลนิ่งของอิเล็กตรอนและโพซิตรอนแต่ละตัวสมมูลพลังงาน 0.511 MeV → โฟตอนต้องมีพลังงาน<b>อย่างน้อย 1.02 MeV (หรือ 1.022 MeV)</b> (ส่วนที่เกิน 1.022 MeV กลายเป็นพลังงานจลน์ของ e⁻ และ e⁺)','<b>ปรากฏการณ์ต่อเนื่อง (Annihilation)</b>: โพซิตรอนเสียพลังงานจนเกือบหยุดแล้วพบอิเล็กตรอนอิสระในสสาร ทั้งคู่ประลัยกันให้โฟตอนแกมมา 2 ลำพุ่งสวนทางกัน ตัวละ <span class="fx">511 keV (0.51 MeV)</span>']},
 {fx:'e⁻ + e⁺ → 2γ (511 keV)'},
 {fig:'แผนภาพอะตอม: Incident x-ray พุ่งเฉียดใกล้นิวเคลียส (Nuclear field) สลายตัวเป็นลูกศร 2 เส้น — Electron (⊖) พุ่งขึ้นขวาบน, Positron (⊕) พุ่งลงล่าง เมื่อ Positron จับคู่กับ Electron ด้านล่าง เกิดคลื่นโฟตอน 2 เส้นพุ่งสวนทางกันในแนวเส้นตรง เส้นละ 0.51 MeV'}],
 key:['เกิดกับ Nuclear field ต้องใช้โฟตอน ≥ 1.02 MeV (ไม่เกิดในรังสีเอกซ์วินิจฉัยทั่วไป แต่พบในรังสีรักษาพลังงานสูง)','สร้างคู่ e⁻ และ e⁺ โดย e⁺ จบลงด้วย Annihilation ให้โฟตอน 2 × 0.511 MeV']},
{n:49,t:'Photonuclear Disintegration (Photodisintegration)',short:'Photonuclear Disintegration',
 body:[{p:'อันตรกิริยาโฟตอนลำดับที่ 5 (พลังงานสูงที่สุด): <b>Photonuclear Disintegration (หรือ Photodisintegration)</b>'},
 {ul:['พลังงานขั้นต่ำ: โฟตอนพลังงานสูงมาก<b>มากกว่าประมาณ 10 MeV</b>','กลไก: โฟตอนพลังงานสูงมากผ่านทะลุอิเล็กตรอนและสนามไฟฟ้านิวเคลียสเข้าไป <b>ถูกดูดกลืนโดยตัวนิวเคลียสเองโดยตรง</b> นิวเคลียสถูกยกขึ้นสู่ Excited state แล้วปลดปล่อยอนุภาคทันที เช่น นิวคลีออน (โปรตอน/นิวตรอน) หรือ Nuclear fragments (เศษนิวเคลียส เช่น แอลฟา)']},
 {fx:'γ + ᴬ_Z X → ᴬ⁻¹_Z X + n'},
 {fx:'γ + ᴬ_Z X → ᴬ⁻⁴_(Z−2) Y + α'},
 {fig:'แผนภาพอะตอม: Incident x-ray พุ่งตรงเข้าชนใจกลางนิวเคลียส ส่งผลให้ก้อนอนุภาคขนาดใหญ่ (Nuclear fragment) ถูกดีดกระเด็นหลุดออกจากนิวเคลียสไปทางขวาล่าง'}],
 key:['เกิดที่พลังงานสูงมาก (&gt; 10 MeV) โฟตอนชนและถูกดูดกลืนโดย<b>นิวเคลียสโดยตรง</b>','เกิดการปล่อยนิวตรอนหรือเศษนิวเคลียส — อีกสาเหตุที่เครื่องเร่งอนุภาคพลังงานสูงในรังสีรักษา (&gt; 10 MV) มีการปนเปื้อนนิวตรอน']},
{n:50,t:'Thank you / Q&A',short:'Q&A · ติดต่ออาจารย์',div:true,
 body:[{p:'หน้าปิดท้ายการบรรยาย: ขอบคุณ (Thank you) ช่วงถาม-ตอบ (Q&A) และอีเมลติดต่ออาจารย์ผู้สอน: <a href="mailto:pornchai.cha@kmpht.ac.th">pornchai.cha@kmpht.ac.th</a>'}],
 key:['เป็นหน้าปิดท้าย ไม่มีเนื้อหาบรรยายเพิ่มเติม — ทบทวนต่อด้วยสรุปภาพรวม สรุปอ่านสอบ บัตรคำ และแบบทดสอบด้านล่างได้เลย']}
];

function fitCanvas(cv){const r=cv.getBoundingClientRect();const d=Math.min(2,window.devicePixelRatio||1);const w=Math.max(50,r.width),h=Math.max(50,r.height);cv.width=Math.round(w*d);cv.height=Math.round(h*d);const ctx=cv.getContext('2d');ctx.setTransform(d,0,0,d,0,0);return{ctx,w,h};}
function fmtSig(x,d){if(!isFinite(x))return'—';d=d||3;if(x===0)return'0';const ax=Math.abs(x);if(ax>=1e5||ax<1e-3){const e=Math.floor(Math.log10(ax));const m=x/Math.pow(10,e);return m.toFixed(2)+'×10'+supNum(e);}return String(parseFloat(x.toPrecision(d)));}
const SUPD={'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
function supNum(n){return String(n).split('').map(c=>SUPD[c]||c).join('');}
function sciHTML(x){if(!isFinite(x)||x===0)return'0';const e=Math.floor(Math.log10(Math.abs(x)));const m=x/Math.pow(10,e);return m.toFixed(2)+'×10<sup>'+e+'</sup>';}

function escHTML(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stripHTML(html){const d=document.createElement('div');d.innerHTML=html;return d.textContent||'';}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}

function overviewHTML(){
 return '<section class="block-sec" id="overview"><div class="sec-head" style="--sc:var(--green)"><div class="ghost-n">Σ</div><div class="sh-k">PART 2</div><h2>สรุปภาพรวมเชื่อมโยงทั้งบท</h2><div class="sh-r">จากระดับมหภาค → อนุภาค → การประยุกต์ทางคลินิก</div></div>'
 +'<article class="slide" style="--sc:var(--green)">'
 +'<p><b>1 · ภาพรวมแหล่งรังสีและคลื่นแม่เหล็กไฟฟ้า (สไลด์ 1–8):</b> มนุษย์ได้รับรังสีเฉลี่ยประมาณ <span class="fx">2.4 mSv/ปี</span> ทั่วโลก โดย <b>84% มาจากธรรมชาติ</b> (ก๊าซเรดอน 48% มากที่สุด) และ <b>16% จากมนุษย์สร้างขึ้น</b> (เกือบทั้งหมดคือรังสีทางการแพทย์) รังสีที่ก่ออันตรายทางชีวภาพคือ Ionizing Radiation แบ่งเป็นคลื่นแม่เหล็กไฟฟ้า (X-ray เกิดนอกนิวเคลียส, Gamma ray เกิดในนิวเคลียส ทั้งคู่พลังงานตาม E = hc/λ) และรังสีอนุภาค</p>'
 +'<p><b>2 · โครงสร้างอะตอมและความเสถียรของนิวเคลียส (สไลด์ 9–19):</b> อะตอมประกอบด้วยนิวเคลียส (p⁺, n) และอิเล็กตรอน (e⁻) นิวไคลด์จำแนกความสัมพันธ์เป็น Isotope, Isotone, Isobar, Isomer ความเสถียรถูกควบคุมโดย n/p ratio (ธาตุเบา Z ≤ 20 ต้องการ n/p ≈ 1, ธาตุหนักต้องการ n/p &gt; 1), ความเป็นเลขคู่–คี่ (Even-Even เสถียรสุด) และพลังงานยึดเหนี่ยวที่แปลงจาก Mass Defect (BE = Δm × 931.5 MeV)</p>'
 +'<p><b>3 · กลไกการสลายตัวกัมมันตรังสี (สไลด์ 20–27):</b> นิวเคลียสไม่เสถียรปรับตัวเข้าสู่เส้นเสถียรภาพ: นิวเคลียสหนัก (Z &gt; 82) ปล่อย α (Monoenergetic) · นิวตรอนเกินปล่อย β⁻ · โปรตอนเกินปล่อย β⁺ (ถ้าพลังงาน ≥ 1.022 MeV ตามด้วย Annihilation 0.511 MeV คู่) หรือ EC (ถ้า &lt; 1.022 MeV) · นิวเคลียสลูกค้างพลังงานคายออกทาง Gamma emission หรือ Internal conversion อัตราการสลายตัวลดแบบเอกซ์โพเนนเชียล A_t = A₀e^(−λt)</p>'
 +'<p><b>4 · อันตรกิริยาของรังสีอนุภาคกับสสาร (สไลด์ 28–38):</b> อนุภาคมีประจุ (Protons, α) ทำปฏิกิริยาโดยตรงผ่านแรงไฟฟ้ากับอิเล็กตรอน (Inelastic collision → Ionization/Excitation) เสียพลังงานต่อเนื่อง (Stopping) พิสัยสั้น High LET และชนนิวเคลียสเกิด Nuclear fragmentation ปล่อยนิวตรอนได้ · อนุภาคไม่มีประจุ (Neutrons) ทำปฏิกิริยาทางอ้อมกับนิวเคลียสตามพลังงาน: Fast (keV–MeV) ชนไฮโดรเจนในน้ำได้ Recoil proton + Hydroxyl, Inelastic scatter ปล่อย γ, ชน ¹²C แตกเป็น 3α · Slow/Thermal (≈0.025 eV) ถูกดูดจับเกิด Radiative capture (ปล่อย γ) หรือ Transmutation (เปลี่ยนธาตุ)</p>'
 +'<p><b>5 · การกำเนิดและอันตรกิริยาของโฟตอนกับสสาร (สไลด์ 39–49):</b> โฟตอนพลังงานสูงเกิดจาก Gamma decay, Annihilation, Bremsstrahlung, Characteristic X-ray เมื่อผ่านเนื้อเยื่อเกิด Attenuation ผ่าน 5 กลไกเรียงตามช่วงเด่นจากต่ำไปสูง: <b>Coherent</b> (&lt;10 keV ไม่ก่อไอออน) → <b>Photoelectric</b> (10–26 keV ดูดกลืนหมดที่ชั้นใน สร้างคอนทราสต์ธาตุ Z สูง) → <b>Compton</b> (26 keV–24 MeV ชนชั้นนอก เกิดรังสีกระเจิง) → <b>Pair production</b> (≥1.02 MeV ชนสนามนิวเคลียสสร้าง e⁻+e⁺) → <b>Photonuclear disintegration</b> (&gt;10 MeV นิวเคลียสดูดกลืนตรงแล้วแตกออก)</p>'
 +'</article></section>';
}
function examHTML(){

 +'<li><b>Photon vs Proton in Matter:</b> Photon = Attenuation (จำนวนลด พลังงานต่อตัวเท่าเดิม LET ต่ำ ทะลุลึก) · Proton = Stopping (จำนวนเท่าเดิม พลังงานลดจนหยุด LET สูง พิสัยสั้น)</li></ul>';

function arcPath(cx,cy,r0,r1,a0,a1){
 const large=(a1-a0)>Math.PI?1:0;
 const p=(r,a)=>[(cx+r*Math.cos(a)).toFixed(2),(cy+r*Math.sin(a)).toFixed(2)];
 const A=p(r1,a0),B=p(r1,a1),C=p(r0,a1),D=p(r0,a0);
 return 'M'+A[0]+' '+A[1]+'A'+r1+' '+r1+' 0 '+large+' 1 '+B[0]+' '+B[1]+'L'+C[0]+' '+C[1]+'A'+r0+' '+r0+' 0 '+large+' 0 '+D[0]+' '+D[1]+'Z';
}

const seen=new Set();
let spyTick=false;
function spy(){
 spyTick=false;
 const y=window.scrollY, tb=parseInt(cssVar('--tb'))||64;
 const doc=document.documentElement;
 const prog=clamp(y/Math.max(1,doc.scrollHeight-window.innerHeight),0,1);
 $('#progress-line').style.width=(prog*100)+'%';
 $('#to-top').classList.toggle('show',y>600);
 const anchors=$$('#readcol [id]').filter(el=>el.matches('article.slide, .lab, section.block-sec, .hero'));
 let active=null;
 const line=y+tb+130;
 for(const el of anchors){if(el.offsetTop<=line)active=el;else break;}
 if(active){
  const id=active.id;
  $$('.sb-link').forEach(a=>{
   const on=a.dataset.target===id;
   a.classList.toggle('active',on);
   if(on){const sb=$('#sb-scroll');const r=a.offsetTop-sb.scrollTop;
    if(r<40||r>sb.clientHeight-60)sb.scrollTo({top:a.offsetTop-sb.clientHeight/2,behavior:'auto'});}
  });
 }
 const vh=window.innerHeight;
 SLIDES.forEach(s=>{const el=document.getElementById('slide-'+s.n);
  if(el&&el.offsetTop<y+vh-80&&!seen.has(s.n)){seen.add(s.n);
   const link=$('.sb-link[data-target="slide-'+s.n+'"]');if(link)link.classList.add('seen');}});
 $('#read-count').textContent='อ่านแล้ว '+seen.size+'/50 สไลด์';
 $('#read-bar').style.width=(seen.size/50*100)+'%';
}
window.addEventListener('scroll',()=>{if(!spyTick){spyTick=true;requestAnimationFrame(spy);}},{passive:true});

let srActive=-1,srResults=[];
function doSearch(q){
 const dd=$('#search-dd');q=q.trim();
 if(q.length<1){dd.classList.remove('open');dd.innerHTML='';srResults=[];return;}
 const ql=q.toLowerCase();const re=new RegExp('('+escReg(q)+')','ig');
 srResults=[];
 for(const it of SEARCH_IDX){
  const ti=it.title.toLowerCase().indexOf(ql),xi=it.text.toLowerCase().indexOf(ql);
  if(ti>=0||xi>=0){
   let snip='';
   if(xi>=0){const st=Math.max(0,xi-38);snip=(st>0?'…':'')+escHTML(it.text.slice(st,xi+q.length+52)).replace(re,'<mark>$1</mark>')+'…';}
   else snip=escHTML(it.text.slice(0,80))+'…';
   srResults.push({it,snip,score:ti>=0?0:1});
   if(srResults.length>=9)break;
  }
 }
 srActive=srResults.length?0:-1;

const QZ={deck:[],idx:0,score:0,revealed:false,done:false,wrong:[],started:false,
 newRun(){
  this.deck=shuffle(QUIZ.map(q=>({q:q.q,c:q.c,ex:q.ex,opts:shuffle(q.o.map((t,i)=>({t,ok:i===q.a})))})));
  this.idx=0;this.score=0;this.revealed=false;this.done=false;this.wrong=[];this.started=true;this.render();
 },
 open(){openModal('modal-quiz');if(!this.started)this.newRun();else this.render();},
 render(){
  const body=$('#qz-body'),foot=$('#qz-foot');
  if(this.done){this.renderResult();return;}
  const q=this.deck[this.idx];
  const prog=(this.idx+(this.revealed?1:0))/this.deck.length*100;
  let h='<div class="qz-top"><span class="fc-count">ข้อ '+(this.idx+1)+' / '+this.deck.length+'</span><div class="qz-prog"><i style="width:'+prog+'%"></i></div><span class="qz-score">คะแนน '+this.score+'</span></div>'
  +'<div class="qz-qnum">'+q.c.toUpperCase()+' · เลือกคำตอบที่ถูกต้องที่สุด</div><div class="qz-q">'+q.q+'</div><div class="qz-opts">';
  q.opts.forEach((o,i)=>{
   let cls='qz-opt';
   if(this.revealed){cls+=o.ok?' ok':(o.chosen?' bad':' dim');}
   h+='<button class="'+cls+'" data-i="'+i+'" '+(this.revealed?'disabled':'')+'><span class="ol">'+String.fromCharCode(65+i)+'</span><span>'+o.t+'</span></button>';
  });
  h+='</div>';
  if(this.revealed){
   const ok=q.opts.some(o=>o.ok&&o.chosen);
   h+='<div class="qz-ex show '+(ok?'good':'bad')+'"><b>'+(ok?'✓ ถูกต้อง!':'✗ ยังไม่ถูก')+'</b>'+q.ex+'</div>';
  }
  body.innerHTML=h;
  Array.from(body.querySelectorAll('.qz-opt')).forEach(b=>b.addEventListener('click',()=>this.answer(+b.dataset.i)));
  foot.innerHTML=this.revealed
   ?'<button class="btn" id="qz-next" style="margin-left:auto">'+(this.idx===this.deck.length-1?'🏁 ดูผลสอบ':'ข้อถัดไป →')+'</button>'
   :'<span style="font-size:.76rem;color:var(--ink3)">เลือกคำตอบแล้วระบบจะเฉลยทันทีพร้อมคำอธิบาย</span>';
  const nx=$('#qz-next');if(nx)nx.addEventListener('click',()=>this.next());
 },
 answer(i){
  if(this.revealed)return;
  const q=this.deck[this.idx];
  q.opts.forEach((o,j)=>{o.chosen=j===i;});
  this.revealed=true;
  const ok=q.opts[i].ok;
  if(ok)this.score++;
  else this.wrong.push({q:q.q,chosen:q.opts[i].t,correct:q.opts.find(o=>o.ok).t,ex:q.ex});
  this.render();
 },
 next(){
  if(this.idx<this.deck.length-1){this.idx++;this.revealed=false;this.render();}
  else{this.done=true;this.render();}
 },
 renderResult(){
  const pct=Math.round(this.score/this.deck.length*100);
  const tier=pct>=90?['🏆 สุดยอด! พร้อมสอบบทนี้แล้ว','var(--green)']:pct>=70?['💪 ดีมาก! เก็บรายละเอียดอีกนิด','var(--cyan)']:pct>=50?['📖 พอใช้ — ทบทวน High-Yield Points','var(--amber)']:['🔁 กลับไปอ่านสรุปอ่านสอบแล้วลองใหม่','var(--red)'];
  const C=2*Math.PI*58;
  let h='<div class="qz-result"><svg class="qz-ring" viewBox="0 0 140 140"><defs><linearGradient id="qzgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--cyan)"/><stop offset="1" stop-color="var(--magenta)"/></linearGradient></defs>'
  +'<circle class="ring-bg" cx="70" cy="70" r="58" fill="none" stroke-width="11"/>'
  +'<circle class="ring-fg" cx="70" cy="70" r="58" fill="none" stroke-width="11" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" transform="rotate(-90 70 70)"/>'
  +'<text class="qz-pct" x="70" y="78" text-anchor="middle">'+pct+'%</text></svg>'
  +'<div class="qz-tier" style="color:'+tier[1]+'">'+tier[0]+'</div>'
  +'<div class="qz-sub">ตอบถูก <b>'+this.score+'</b> จาก '+this.deck.length+' ข้อ · ผิด '+this.wrong.length+' ข้อ</div>';
  if(this.wrong.length){
   h+='<div style="text-align:left;font-size:.82rem;font-weight:800;color:var(--amber)">📌 ทบทวนข้อที่ตอบผิด:</div><div class="qz-review">'
   +this.wrong.map(w=>'<div class="qz-rev-item"><div class="rq">'+w.q+'</div><div class="ra">คุณตอบ: '+w.chosen+'</div><div class="rc">เฉลย: '+w.correct+'</div><div style="color:var(--ink3)">'+w.ex+'</div></div>').join('')+'</div>';
  }
  h+='</div>';
  $('#qz-body').innerHTML=h;
  $('#qz-foot').innerHTML='<button class="btn ghost" id="qz-close2">ปิด</button><button class="btn" id="qz-restart" style="margin-left:auto">🔄 ทำใหม่ (สุ่มข้อ+ตัวเลือก)</button>';
  $('#qz-restart').addEventListener('click',()=>{this.newRun();toast('เริ่มแบบทดสอบใหม่');});
  $('#qz-close2').addEventListener('click',()=>closeModal('modal-quiz'));
  requestAnimationFrame(()=>{const fg=$('#qz-body .ring-fg');if(fg)fg.style.strokeDashoffset=String(C*(1-pct/100));});
 }
};

function initWave(){
 const cv=$('#wv-cv');if(!cv)return;
 const S={lam:0.4,amp:34,spd:1,phase:0,playing:!RM,raf:0,last:0,visible:true};
 let ctx,W,H;
 function fit(){const f=fitCanvas(cv);ctx=f.ctx;W=f.w;H=f.h;}
 function lamM(){return Math.pow(10,-8-5*S.lam);}
 function band(kev){
  if(kev<1)return['UV / นอกช่วงวินิจฉัย','var(--green)'];
  if(kev<10)return['Soft X-ray · Coherent เด่น','var(--teal)'];
  if(kev<26)return['X-ray วินิจฉัย · Photoelectric เด่น','var(--amber)'];
  if(kev<1000)return['Compton เด่น (26 keV–24 MeV)','var(--cyan)'];
  return['ระดับ MeV · Pair ≥1.02 MeV','var(--magenta)'];
 }
 function upd(){
  const L=lamM(),f=2.998e8/L,EJ=6.63e-34*f,Ek=EJ/1.602e-16;
  $('#wv-lam-v').textContent=fmtSig(L*1e9,3)+' nm';
  $('#wv-amp-v').textContent=S.amp+' px';
  $('#wv-spd-v').textContent=S.spd.toFixed(1)+'×';
  $('#wv-f').innerHTML=sciHTML(f)+' <small>Hz</small>';
  $('#wv-ej').innerHTML=sciHTML(EJ)+' <small>J</small>';
  $('#wv-ek').innerHTML=Ek>=1000?(fmtSig(Ek/1000,3)+' <small>MeV</small>'):(fmtSig(Ek,3)+' <small>keV</small>');
  const b=band(Ek);const el=$('#wv-band');el.textContent=b[0];el.style.color=b[1];
 }
 function draw(){
  if(!ctx)return;
  const P=PAL();const L=lamM(),Ek=6.63e-34*(2.998e8/L)/1.602e-16;
  const b=band(Ek);const col=cssVar(b[1].slice(4,-1));
  ctx.clearRect(0,0,W,H);
  const mid=H/2+8,cycles=2+9*S.lam,k=2*Math.PI*cycles/W;
  ctx.strokeStyle=P.line;ctx.setLineDash([4,5]);ctx.beginPath();ctx.moveTo(0,mid);ctx.lineTo(W,mid);ctx.stroke();ctx.setLineDash([]);
  ctx.lineWidth=2.6;ctx.strokeStyle=col;ctx.shadowColor=col;ctx.shadowBlur=12;
  ctx.beginPath();
  for(let x=0;x<=W;x+=2){const y=mid-S.amp*Math.sin(k*x-S.phase);x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke();ctx.shadowBlur=0;
  const wlPx=2*Math.PI/k;
  const x0=((S.phase/k)%wlPx+wlPx)%wlPx+wlPx*0.5;
  if(x0+wlPx<W-10){
   const yT=mid-S.amp;
   ctx.strokeStyle=P.ink3;ctx.lineWidth=1.2;
   ctx.beginPath();ctx.moveTo(x0,yT-16);ctx.lineTo(x0,yT-6);ctx.moveTo(x0+wlPx,yT-16);ctx.lineTo(x0+wlPx,yT-6);ctx.moveTo(x0,yT-11);ctx.lineTo(x0+wlPx,yT-11);ctx.stroke();
   ctx.fillStyle=P.ink2;ctx.font='12px "Noto Sans Thai",sans-serif';ctx.textAlign='center';
   ctx.fillText('λ = '+fmtSig(L*1e9,3)+' nm',x0+wlPx/2,yT-22);
  }
  ctx.strokeStyle=P.magenta;ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(26,mid);ctx.lineTo(26,mid-S.amp);ctx.stroke();
  ctx.beginPath();ctx.moveTo(22,mid-S.amp+6);ctx.lineTo(26,mid-S.amp);ctx.lineTo(30,mid-S.amp+6);ctx.stroke();
  ctx.fillStyle=P.magenta;ctx.textAlign='left';ctx.font='11.5px "Noto Sans Thai",sans-serif';
  ctx.fillText('Amplitude (ความเข้ม)',34,mid-S.amp/2);
  ctx.fillStyle=P.ink3;ctx.font='11px "Noto Sans Thai",sans-serif';
  ctx.fillText('คลื่นเลื่อน → ทิศการเคลื่อนที่ · λ สั้น = ยอดถี่ = พลังงานต่อโฟตอนสูง',12,H-12);
 }
 function loop(ts){
  S.raf=requestAnimationFrame(loop);
  if(!S.playing||!S.visible)return;
  const dt=Math.min(0.05,(ts-S.last)/1000||0);S.last=ts;
  S.phase+=dt*S.spd*4;draw();
 }
 function start(){if(S.raf)cancelAnimationFrame(S.raf);S.last=performance.now();S.raf=requestAnimationFrame(loop);}
 function setPlay(v){S.playing=v;$('#wv-play').textContent=v?'⏸ หยุดคลื่น':'▶ เล่นคลื่น';if(v)S.last=performance.now();draw();}
 $('#wv-lam').addEventListener('input',e=>{S.lam=+e.target.value;upd();draw();});
 $('#wv-amp').addEventListener('input',e=>{S.amp=+e.target.value;upd();draw();});
 $('#wv-spd').addEventListener('input',e=>{S.spd=+e.target.value;upd();});
 $('#wv-play').addEventListener('click',()=>setPlay(!S.playing));
 const io=new IntersectionObserver(en=>{S.visible=en[0].isIntersecting;},{threshold:0.05});io.observe(cv);
 fit();upd();draw();start();setPlay(!RM);
 RESIZERS.push(()=>{fit();draw();});
 REDRAWS.push(()=>{upd();draw();});
 LAB_RESET['lab-wave']=()=>{S.lam=0.4;S.amp=34;S.spd=1;S.phase=0;$('#wv-lam').value=0.4;$('#wv-amp').value=34;$('#wv-spd').value=1;upd();setPlay(!RM);};
}

  const p=ST_PRESETS[+b.dataset.i];S.z=p[1];S.n=p[2];
  $('#st-z').value=S.z;$('#st-n').value=S.n;upd();
  Array.from(pr.querySelectorAll('.chip')).forEach(c=>c.classList.toggle('on',c===b));
 }));
 const ODD_OK=[[1,1],[3,3],[5,5],[7,7]];
 function predict(z,n){
  if(z>82)return{m:'α decay',c:'--amber',dir:[-2,-2],txt:'Z = '+z+' > 82 → นิวเคลียสใหญ่เกิน มักปล่อยแอลฟา (⁴₂He) ลด A ลง 4 และ Z ลง 2 (ลูกศรลง-ซ้าย)'};
  const d=n-stableN(z);
  if(d>=1)return{m:'β⁻ decay',c:'--cyan',dir:[1,-1],txt:'N = '+n+' สูงกว่าแนวเสถียร (≈'+stableN(z).toFixed(1)+') → นิวตรอนเกิน เปลี่ยน n → p + β⁻ + ν̄ (ลูกศรลง-ขวา: Z+1, N−1)'};
  if(d<=-1)return{m:'β⁺ / EC',c:'--magenta',dir:[-1,1],txt:'N = '+n+' ต่ำกว่าแนวเสถียร (≈'+stableN(z).toFixed(1)+') → โปรตอนเกิน เปลี่ยน p → n ผ่าน β⁺ (พลังงาน ≥1.022 MeV) หรือ EC (ลูกศรขึ้น-ซ้าย: Z−1, N+1)'};
  return{m:'ใกล้แนวเสถียร',c:'--green',dir:null,txt:'n/p อยู่ในแถบเสถียรตามแบบจำลอง (Z ≤ 20 ต้องการ n/p ≈ 1, Z > 20 ต้องการ n/p > 1) — นิวไคลด์จริงอาจต่างได้ เพราะนี่คือเส้นประมาณเชิงแนวคิด'};
 }
 function upd(){
  $('#st-z-v').textContent=S.z;$('#st-n-v').textContent=S.n;
  const sym=SYMS[S.z-1]||'?';
  $('#st-nuc').textContent=supNum(S.z+S.n)+' '+sym+' (Z='+S.z+', N='+S.n+')';
  $('#st-ratio').textContent=(S.n/S.z).toFixed(2);
  const ze=S.z%2===0,ne=S.n%2===0;
  let ee=ze&&ne?'คู่–คู่ (Even–Even) · เสถียรสุด':(!ze&&!ne?'คี่–คี่ (Odd–Odd)':'คี่–คู่ / คู่–คี่');
  if(!ze&&!ne&&ODD_OK.some(o=>o[0]===S.z&&o[1]===S.n))ee+=' · ข้อยกเว้นที่เสถียร!';
  $('#st-ee').textContent=ee;
  const p=predict(S.z,S.n);
  $('#st-pred').textContent=p.m;$('#st-pred').style.color=cssVar(p.c);
  $('#st-expl').innerHTML='<b>คำทำนาย:</b> '+p.txt;
  const c=$('#st-c');c.setAttribute('cx',x(S.z));c.setAttribute('cy',y(S.n));c.setAttribute('fill',cssVar(p.c));
  const ar=$('#st-arrow');
  if(p.dir){
   const sc=10;
   ar.setAttribute('x1',x(S.z));ar.setAttribute('y1',y(S.n));
   ar.setAttribute('x2',x(S.z+p.dir[0]*sc));ar.setAttribute('y2',y(S.n+p.dir[1]*sc));
   ar.setAttribute('stroke',cssVar(p.c));ar.setAttribute('visibility','visible');
  }else ar.setAttribute('visibility','hidden');
 }
 $('#st-z').addEventListener('input',e=>{S.z=+e.target.value;upd();});
 $('#st-n').addEventListener('input',e=>{S.n=+e.target.value;upd();});
 $('#st-svg').addEventListener('click',e=>{

 });

/* ============================================================
   15) LAB — DECAY
============================================================ */
function initDecay(){
 const cv=$('#dk-dots'),curve=$('#dk-curve');if(!cv)return;
 const N=400;
 const S={t:0,hl:59.4,unit:'วัน',name:'¹²⁵I',custom:false,hlCustom:10,spd:1,playing:false,raf:0,last:0,seeds:[]};
 let ctx,W,H;
 function fit(){const f=fitCanvas(cv);ctx=f.ctx;W=f.w;H=f.h;}
 function reseed(){S.seeds=Array.from({length:N},()=>-Math.log(Math.random())/Math.LN2);}
 function T(){return S.custom?S.hlCustom:S.hl;}
 function unit(){return S.custom?'หน่วย':S.unit;}
 function theo(t){return Math.pow(0.5,t);}
 function buildCurve(){
  const W2=680,H2=210,L=52,R=14,Tp=14,B=34;
  const x=t=>L+t/5*(W2-L-R),y=f=>Tp+(1-f)*(H2-Tp-B);
  let g='';
  for(let k=0;k<=5;k++){
   g+='<line x1="'+x(k)+'" y1="'+Tp+'" x2="'+x(k)+'" y2="'+(H2-B)+'" stroke="var(--line)"/>'
   +'<text x="'+x(k)+'" y="'+(H2-B+16)+'" text-anchor="middle" font-size="10.5" fill="var(--ink3)" class="mono">'+k+' T½</text>';
   if(k>0){const f=Math.pow(0.5,k);g+='<line x1="'+L+'" y1="'+y(f)+'" x2="'+(W2-R)+'" y2="'+y(f)+'" stroke="var(--line)" stroke-dasharray="3 4"/><text x="'+(L-6)+'" y="'+(y(f)+4)+'" text-anchor="end" font-size="9.5" fill="var(--ink3)" class="mono">'+(f*100).toFixed(f<0.1?2:1)+'%</text>';}
  }
  g+='<text x="'+(L-6)+'" y="'+(y(1)+4)+'" text-anchor="end" font-size="9.5" fill="var(--ink3)" class="mono">100%</text>';
  let d='M'+x(0)+' '+y(1);
  for(let i=1;i<=100;i++){const t=i/100*5;d+=' L'+x(t).toFixed(1)+' '+y(theo(t)).toFixed(1);}
  g+='<path d="'+d+' L'+x(5)+' '+y(0)+' L'+x(0)+' '+y(0)+' Z" fill="var(--cyan)" opacity=".1"/>'
  +'<path d="'+d+'" fill="none" stroke="var(--cyan)" stroke-width="2.6"/>';
  g+='<line id="dk-mx" x1="'+x(0)+'" y1="'+Tp+'" x2="'+x(0)+'" y2="'+(H2-B)+'" stroke="var(--amber)" stroke-width="1.6" stroke-dasharray="4 4"/>'
  +'<circle id="dk-mc" cx="'+x(0)+'" cy="'+y(1)+'" r="6.5" fill="var(--amber)" stroke="var(--bg)" stroke-width="2"/>';
  curve.innerHTML='<svg viewBox="0 0 '+W2+' '+H2+'" role="img" aria-label="เส้นโค้งการสลายตัวแบบเอกซ์โพเนนเชียล">'+g+'</svg>';
  curve._x=x;curve._y=y;
 }
 function drawDots(){
  if(!ctx)return;
  const P=PAL();ctx.clearRect(0,0,W,H);
  const cols=40,rows=10,gx=W/(cols+1),gy=H/(rows+1);
  let alive=0;
  for(let i=0;i<N;i++){
   const cx=gx*(i%cols+1),cy=gy*(Math.floor(i/cols)+1);
   const alive_i=S.t<S.seeds[i];
   if(alive_i){alive++;ctx.fillStyle=P.cyan;ctx.shadowColor=P.cyan;ctx.shadowBlur=5;
    ctx.beginPath();ctx.arc(cx,cy,3.1,0,7);ctx.fill();ctx.shadowBlur=0;}
   else{const age=clamp((S.t-S.seeds[i])/0.5,0,1);
    ctx.strokeStyle=P.ink3;ctx.globalAlpha=0.55-0.35*age;ctx.lineWidth=1;
    ctx.beginPath();ctx.arc(cx,cy,2.4,0,7);ctx.stroke();ctx.globalAlpha=1;}
  }
  return alive;
 }
 function upd(){
  const t=T();
  $('#dk-hl-v').textContent=S.custom?S.hlCustom:'—';
  $('#dk-t-v').textContent=S.t.toFixed(2)+' T½';
  $('#dk-spd-v').textContent=S.spd.toFixed(1)+'×';
  $('#dk-lam').innerHTML='0.693/'+fmtSig(t,3)+' = '+fmtSig(0.693/t,3)+' <small>/'+unit()+'</small>';
  const f=theo(S.t);
  $('#dk-frac').textContent=(f*100).toFixed(f<0.1?2:1)+'%';
  $('#dk-act').textContent=(f*100).toFixed(f<0.1?2:1)+'%';
  const alive=drawDots();
  $('#dk-alive').textContent=alive+' / 400';
  const mx=curve.querySelector('#dk-mx'),mc=curve.querySelector('#dk-mc');
  if(mx&&curve._x){mx.setAttribute('x1',curve._x(S.t));mx.setAttribute('x2',curve._x(S.t));
   mc.setAttribute('cx',curve._x(S.t));mc.setAttribute('cy',curve._y(f));}
  const tReal=S.t*t;
  $('#dk-t-v').textContent=S.t.toFixed(2)+' T½ = '+fmtSig(tReal,3)+' '+unit();
 }
 function loop(ts){
  S.raf=requestAnimationFrame(loop);
  if(!S.playing)return;
  const dt=Math.min(0.06,(ts-S.last)/1000||0);S.last=ts;
  S.t=Math.min(5,S.t+dt*S.spd*0.5);
  $('#dk-t').value=S.t;
  upd();
  if(S.t>=5)setPlay(false);
 }
 function setPlay(v){S.playing=v;$('#dk-play').textContent=v?'⏸ หยุด':'▶ เล่น';if(v){S.last=performance.now();if(!S.raf)S.raf=requestAnimationFrame(loop);}}
 $('#dk-play').addEventListener('click',()=>{if(S.t>=5)S.t=0;setPlay(!S.playing);upd();});
 $('#dk-t').addEventListener('input',e=>{S.t=+e.target.value;upd();});
 $('#dk-spd').addEventListener('input',e=>{S.spd=+e.target.value;upd();});
 $('#dk-hl').addEventListener('input',e=>{S.hlCustom=+e.target.value;upd();});
 $('#dk-iso').addEventListener('change',e=>{
  const v=e.target.value;
  if(v==='custom'){S.custom=true;$('#dk-hl').disabled=false;}
  else{const p=v.split('|');S.hl=+p[0];S.unit=p[1];S.name=p[2];S.custom=false;$('#dk-hl').disabled=true;}
  S.t=0;$('#dk-t').value=0;reseed();upd();
 });
 function conv(){
  const v=parseFloat($('#dk-cv-val').value)||0,u=$('#dk-cv-unit').value;
  const bq=u==='ci'?v*3.7e10:u==='mci'?v*3.7e7:v;
  $('#dk-cv-out').innerHTML='= <b>'+sciHTML(bq)+' Bq</b> = <b>'+sciHTML(bq/3.7e10)+' Ci</b> = <b>'+sciHTML(bq/3.7e7)+' mCi</b>';
 }
 $('#dk-cv-val').addEventListener('input',conv);$('#dk-cv-unit').addEventListener('change',conv);
 fit();reseed();buildCurve();upd();conv();
 S.raf=requestAnimationFrame(loop);
 RESIZERS.push(()=>{fit();upd();});
 REDRAWS.push(()=>{upd();});
 LAB_RESET['lab-decay']=()=>{S.t=0;S.spd=1;$('#dk-t').value=0;$('#dk-spd').value=1;setPlay(false);reseed();upd();};
}

/* ============================================================
   16) LAB — BEAM (Photons vs Protons)
============================================================ */
function initBeam(){
 const cv=$('#bm-cv');if(!cv)return;
 const S={e:5,spd:1,p:0,playing:false,raf:0,last:0,seeds:null};
 let ctx,W,H;
 function fit(){const f=fitCanvas(cv);ctx=f.ctx;W=f.w;H=f.h;}
 function params(){
  const medX=W*0.34,medW=W*0.58;
  const R=medX+medW*(0.25+0.065*S.e);
  const mu=2.6/S.e;
  return{medX,medW,R:Math.min(R,medX+medW*0.97),mu};
 }
 function seed(){
  const P=params();
  S.seeds={ph:Array.from({length:14},(_,i)=>{
   const depth=-Math.log(Math.random())/P.mu*P.medW;
   return{s:i*0.035,d:0.55,depth,abs:Math.random()<0.62,dir:Math.random()<0.5?-1:1};
  }),pr:Array.from({length:14},(_,i)=>({s:i*0.035,d:0.6}))};
 }
 function draw(){
  if(!ctx)return;
  const P=PAL(),pa=params();
  ctx.clearRect(0,0,W,H);
  const yPh=H*0.28,yPr=H*0.74;
  ctx.fillStyle=P.blue;ctx.globalAlpha=0.07;ctx.fillRect(pa.medX,10,pa.medW,H-20);ctx.globalAlpha=1;
  ctx.strokeStyle=P.line;ctx.strokeRect(pa.medX,10,pa.medW,H-20);
  ctx.fillStyle=P.ink3;ctx.font='11px "Noto Sans Thai",sans-serif';ctx.textAlign='left';
  ctx.fillText('อากาศ',12,22);ctx.fillText('ตัวกลาง / เนื้อเยื่อ',pa.medX+8,22);
  ctx.fillStyle=P.cyan;ctx.font='bold 12px "Noto Sans Thai",sans-serif';
  ctx.fillText('Photons (ไม่มีประจุ) → Attenuation',12,yPh-38);
  ctx.fillStyle=P.red;ctx.fillText('Protons (มีประจุ) → Stopping',12,yPr-38);
  ctx.setLineDash([5,5]);ctx.strokeStyle=P.red;ctx.globalAlpha=.6;
  ctx.beginPath();ctx.moveTo(pa.R,yPr-30);ctx.lineTo(pa.R,yPr+30);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;
  ctx.fillStyle=P.red;ctx.font='10.5px "JetBrains Mono",monospace';ctx.textAlign='center';ctx.fillText('R (พิสัย)',pa.R,yPr+44);
  let arrived=0,stopped=0;
  const startX=W*0.05;
  for(let i=0;i<14;i++){
   const off=(i%7)*4-12,row=Math.floor(i/7)*13-6;
   if(S.seeds){
    const sd=S.seeds.ph[i];
    const q=clamp((S.p-sd.s)/sd.d,0,1);
    const hit=sd.depth<pa.medW;
    const xInt=pa.medX+sd.depth;
    const xEnd=hit?xInt:W*0.965;
    let px=lerp(startX,xEnd,easeIO(q)),py=yPh+row,alpha=1;
    const post=clamp((S.p-sd.s-sd.d)/0.22,0,1);
    if(hit&&q>=1){
     if(sd.abs){alpha=1-post;}
     else{px=xInt+post*36;py=yPh+row+sd.dir*post*34;alpha=1-post;}
    }
    if(!hit&&q>=1)arrived++;
    if(alpha>0.02){
     ctx.globalAlpha=alpha;ctx.fillStyle=P.cyan;ctx.shadowColor=P.cyan;ctx.shadowBlur=8;
     ctx.beginPath();ctx.arc(px+off*0.4,py,4,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
    if(hit&&q>=1&&post<0.35&&sd.abs){
     ctx.strokeStyle=P.amber;ctx.globalAlpha=1-post/0.35;ctx.lineWidth=1.6;
     ctx.beginPath();ctx.arc(xInt,yPh+row,7+post*16,0,7);ctx.stroke();ctx.globalAlpha=1;
    }
   }else{
    ctx.fillStyle=P.cyan;ctx.globalAlpha=.85;ctx.beginPath();ctx.arc(startX+(i%7)*7,yPh+row,4,0,7);ctx.fill();ctx.globalAlpha=1;
   }
   if(S.seeds){
    const sd=S.seeds.pr[i];
    const q=clamp((S.p-sd.s)/sd.d,0,1);
    const px=lerp(startX,pa.R,easeIO(q));
    const frac=clamp((px-pa.medX)/(pa.R-pa.medX),0,1);
    const bright=1-0.82*frac;
    if(q>=1){stopped++;
     const post=clamp((S.p-sd.s-sd.d)/0.25,0,1);
     if(post<0.5){ctx.strokeStyle=P.red;ctx.globalAlpha=1-post*2;ctx.beginPath();ctx.arc(px,yPr+row,6+post*14,0,7);ctx.stroke();ctx.globalAlpha=1;}
    }
    const col=q>=1?P.ink3:P.red;
    ctx.fillStyle=col;ctx.globalAlpha=Math.max(0.25,bright);ctx.shadowColor=P.red;ctx.shadowBlur=q>=1?0:9*bright;
    ctx.beginPath();ctx.arc(px+(i%7)*2,yPr+row,4.4,0,7);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;
   }else{
    ctx.fillStyle=P.red;ctx.globalAlpha=.9;ctx.beginPath();ctx.arc(startX+(i%7)*7,yPr+row,4.4,0,7);ctx.fill();ctx.globalAlpha=1;
   }
  }
  ctx.textAlign='left';ctx.font='11px "Noto Sans Thai",sans-serif';ctx.fillStyle=P.ink3;
  ctx.fillText('จำนวนลด · ตัวรอดพลังงานเท่าเดิม · ไม่มีจุดหยุดตายตัว',12,yPh+42);
  ctx.fillText('จำนวนเท่าเดิม · พลังงานลดเรื่อย ๆ · หยุดพร้อมกันที่ R',12,yPr+58);
  if(S.seeds&&S.p>=1){
   ctx.fillStyle=P.green;ctx.font='bold 11.5px "Noto Sans Thai",sans-serif';
   ctx.fillText('STOP — โปรตอนทุกตัวหยุดที่พิสัย R',pa.R-70,yPr-40);
  }
  $('#bm-ph').textContent=(S.seeds?arrived:'—')+' / 14';
  $('#bm-pr').textContent=(S.seeds?stopped:'—')+' / 14';
  if(S.seeds&&S.p>=1)$('#bm-note').textContent='พลังงานลำรังสี '+S.e+': โฟตอนรอด '+arrived+'/14 ตัว (พลังงานเท่าเดิม) · โปรตอนหยุดครบ 14/14 ที่ R';
 }
 function loop(ts){
  S.raf=requestAnimationFrame(loop);
  if(!S.playing)return;
  const dt=Math.min(0.06,(ts-S.last)/1000||0);S.last=ts;
  S.p=Math.min(1,S.p+dt*S.spd/3.2);
  draw();
  if(S.p>=1)S.playing=false;
 }
 $('#bm-fire').addEventListener('click',()=>{seed();S.p=0;S.playing=true;S.last=performance.now();if(!S.raf)S.raf=requestAnimationFrame(loop);$('#bm-note').textContent='กำลังยิง… ดูลำรังสีทั้งสองแถว';});
 $('#bm-e').addEventListener('input',e=>{S.e=+e.target.value;$('#bm-e-v').textContent=S.e;S.seeds=null;S.p=0;S.playing=false;draw();$('#bm-note').textContent='พลังงานเปลี่ยนแล้ว — กด “ยิงลำรังสี” อีกครั้ง';});
 $('#bm-spd').addEventListener('input',e=>{S.spd=+e.target.value;$('#bm-spd-v').textContent=S.spd.toFixed(1)+'×';});
 fit();draw();S.raf=requestAnimationFrame(loop);
 RESIZERS.push(()=>{fit();S.seeds=null;S.p=0;draw();});
 REDRAWS.push(draw);
 LAB_RESET['lab-beam']=()=>{S.e=5;S.spd=1;S.seeds=null;S.p=0;S.playing=false;$('#bm-e').value=5;$('#bm-e-v').textContent='5';$('#bm-spd').value=1;$('#bm-spd-v').textContent='1.0×';$('#bm-note').textContent='กด “ยิงลำรังสี” เพื่อเริ่ม';draw();};
